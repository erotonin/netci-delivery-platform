name: Bug report
description: Report reproducible incorrect behaviour in netCI.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Portal, PostgreSQL, Jenkins, Temporal, Ansible, Security policy, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, exit codes and sanitized logs. Never include credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment profile, browser/runtime versions and relevant sanitized configuration.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secret or private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
