version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The controller image is not updated by a bot: its base and every plugin are declared in
  # toolchain/versions.yaml and generated (scripts/toolchain_sync.py, ADR-059).
  - package-ecosystem: docker
    directory: /jenkins/agent-toolbox
    schedule:
      interval: weekly
