# netCI's own pipeline.
#
# The platform gates other people's changes; this gates changes to the platform. It runs
# the `portable` profile from release-checklist.yaml -- the same checks, invoked the same
# way, so a green run here and a green `make release-portable` locally mean the same
# thing. There is deliberately no second list of steps here to drift from the checklist.
#
# The eleven acceptance gates are not here. They need a kind cluster, two Jenkins
# controllers, a registry and a Backstage instance, and a workflow that pretended to run
# them would be exactly the false green this project exists to prevent. `make release-ubuntu`
# runs them on a host that has that lab; see QUICKSTART.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable release profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pyflakes

      # `npm ci` rather than `npm install`: the lockfile is the pin, and validate_windows.py
      # fails the build if package.json and the lockfile disagree.
      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # One command, because release-checklist.yaml is the source of truth for what a
      # release must pass. Adding a check there adds it here with no workflow change.
      - name: Run the portable release profile
        run: python scripts/validate_release.py --profile portable --execute
        env:
          PYTHONPATH: backend

      - name: Lint for unused imports and undefined names
        run: python -m pyflakes backend/app scripts

  database:
    name: migrations and durability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: netci
          POSTGRES_USER: netci
          POSTGRES_PASSWORD: netci-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U netci -d netci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      # Applied forward from empty, which is the case a checksum drift or a bad ALTER
      # shows up in. `--check-schema` then proves schema.sql still matches the migrations.
      - name: Apply migrations to an empty database
        run: |
          python scripts/migrate.py
          python scripts/migrate.py --status
          python scripts/migrate.py --check-schema
        env:
          DATABASE_URL: postgresql://netci:netci-ci-only@127.0.0.1:5432/netci

      # Restart recovery, durable delivery events, idempotency replay and the
      # compare-and-set that decides which of two concurrent writers wins. These are
      # skipped without a database, so CI is the only place they run on every change.
      - name: Durability tests against a real PostgreSQL
        run: python -m pytest backend/tests/test_persistence_postgres.py -v
        env:
          PYTHONPATH: backend
          NETCI_TEST_DATABASE_URL: postgresql://netci:netci-ci-only@127.0.0.1:5432/netci

      # A backup nobody has restored is a hope. These restore a dump into a throwaway
      # database and compare it, and assert that a truncated dump and a restore that
      # loses rows both fail -- the two ways a backup disappoints you quietly.
      - name: Backup and restore
        run: python -m pytest backend/tests/test_backup_restore.py -v
        env:
          PYTHONPATH: backend
          NETCI_TEST_DATABASE_URL: postgresql://netci:netci-ci-only@127.0.0.1:5432/netci

  portal-browser:
    name: portal in a real browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: netci
          POSTGRES_USER: netci
          POSTGRES_PASSWORD: netci-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U netci -d netci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12.10', cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium

      # A real API, not a fixture server. The unit suite mocks netciClient and so cannot
      # catch the Portal and the API disagreeing about a field name or a status code,
      # which is the entire reason this job exists.
      - name: Start netCI
        run: |
          python scripts/migrate.py
          PYTHONPATH=backend nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8100/healthz && break; sleep 1; done
        env:
          DATABASE_URL: postgresql://netci:netci-ci-only@127.0.0.1:5432/netci
          NETCI_ALLOWED_ORIGINS: http://127.0.0.1:4173
          NETCI_DEMO_DATA: 'true'

      - name: Browser tests and accessibility scan
        run: npm --prefix frontend run test:e2e
        env:
          CI: 'true'
          NETCI_API_URL: http://127.0.0.1:8100

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  supply-chain:
    name: signature verification against real cosign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.7.0

      # The deploy-time verifier skips itself when cosign is absent, so without this step
      # the suite would pass while proving nothing about the control it exists to test.
      # A fake binary already covers the plumbing; only the real one covers verification.
      - name: Verify against a real key pair
        run: |
          cosign version
          python -m pytest backend/tests/test_signature_verification.py backend/tests/test_auth_oidc.py -v
        env:
          PYTHONPATH: backend
