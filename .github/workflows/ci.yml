name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    # The queue's tests run against a real PostgreSQL; without it they skip, and a skipped
    # test proves nothing -- so CI refuses to run them without it (make check-pg).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netci_queue
          POSTGRES_USER: netci
          POSTGRES_PASSWORD: netci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netci" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      NETCI_QUEUE_TEST_DATABASE_URL: postgresql://netci:netci-test-only@127.0.0.1:5432/netci_queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check-pg
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -f jenkins/plugin/pom.xml verify
