name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching DCO sign-off on every commit
        run: node scripts/validate_dco.mjs "origin/${{ github.base_ref }}..HEAD"
