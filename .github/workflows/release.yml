name: signed-release

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Require successful CI for the exact released commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          verified_sha="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${target_sha}&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [[ "${verified_sha}" != "${target_sha}" ]]; then
            echo "No successful ci.yml run exists for released commit ${target_sha}" >&2
            exit 1
          fi

      - name: Prepare release directory
        run: mkdir -p dist

      - name: Generate SPDX source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/netci-source-sbom.spdx.json
          artifact-name: netci-source-sbom.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Create source archive from the released tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          git archive \
            --format=tar.gz \
            --prefix="netci-${RELEASE_TAG}/" \
            --output="dist/netci-${RELEASE_TAG}.tar.gz" \
            "refs/tags/${RELEASE_TAG}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382 # v3.7.0
        with:
          cosign-release: v3.1.2

      - name: Checksum and keyless-sign release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "netci-${RELEASE_TAG}.tar.gz" netci-source-sbom.spdx.json > SHA256SUMS
          cosign sign-blob --yes \
            --bundle "netci-${RELEASE_TAG}.tar.gz.sigstore.json" \
            "netci-${RELEASE_TAG}.tar.gz"
          cosign sign-blob --yes \
            --bundle netci-source-sbom.spdx.json.sigstore.json \
            netci-source-sbom.spdx.json
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attach immutable artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
