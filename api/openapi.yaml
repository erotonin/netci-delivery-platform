            schema:
              type: object
              required: [activeColor]
              properties:
                activeColor: { type: string, enum: [blue, green] }
      responses:
        '200':
          description: Switched; the deployment's activeColor and the router's observation
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploymentId: { type: string, format: uuid }
                  activeColor: { type: string }
                  previousColor: { type: string, nullable: true }
                  routerStatus: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          description: No traffic router is configured (NETCI_TRAFFIC_ROUTER)
