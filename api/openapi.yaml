  /deployments/{deploymentId}/traffic/switch:
    post:
      operationId: switchDeploymentTraffic
      summary: Point the stable ingress at a colour (blue/green switch-back or forward)
      description: >-
        Both colours keep running after a blue/green release (ADR-035), so going back is one
        patch of the stable Ingress, not a redeploy. Reviewer or above. The router refuses a
        colour with no ready endpoints (409 `TRAFFIC_SWITCH_REFUSED`); a deployment that is not
        blue/green has no colours (409 `NOT_BLUE_GREEN`); no router configured -> 501.
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      requestBody:
        required: true
        content:
