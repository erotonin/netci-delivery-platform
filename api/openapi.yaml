openapi: 3.0.3
info:
  title: netCI Delivery API
  version: 0.1.0
  description: API-first contract for netCI Delivery Platform.
servers:
  - url: http://localhost:8000

paths:
  /livez:
    get:
      summary: Basic process liveness probe
      operationId: livez
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /readyz:
    get:
      summary: Truthful readiness probe for accepting work
      operationId: readyz
      responses:
        '200':
          description: Service is ready to accept and execute work
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Required dependency is unavailable
          content:
            application/json:
              schema:
                type: object
  /operator/health:
    get:
      summary: Detailed authenticated operator health probe
      operationId: operatorHealth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detailed diagnostic health report with redacted secrets
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Required dependency is unavailable
          content:
            application/json:
              schema:
                type: object
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy and every configured dependency is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A configured dependency is unreachable; writes would fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /stage-catalog:
    get:
      operationId: listStageCatalog
      responses:
        '200':
          description: Available stages and templates
          content:
            application/json:
              schema:
                type: object
                required: [stages, templates]
                properties:
                  stages:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageDefinition'
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateDefinition'
  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /dcim/services:
    get:
      operationId: searchDcimServices
      description: Search the configured DCIM service catalog; returns not_configured with no items when absent.
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, default: '' }
      responses:
        '200': { description: Matching DCIM services and source metadata }
  /dcim/modules:
    get:
      operationId: listDcimModules
      description: List modules returned by the configured DCIM integration.
      parameters:
        - name: systemId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: DCIM modules and source metadata }
        '404': { $ref: '#/components/responses/NotFound' }
  /dcim/servers:
    get:
      operationId: listDcimServers
      description: List real server inventory for a system and optional module from the configured DCIM integration.
      parameters:
        - name: systemId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: moduleId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: DCIM servers and source metadata }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Configured DCIM integration is unreachable or returned an invalid response }
  /systems:
    get:
      operationId: listSystems
      responses:
        '200':
          description: Release Portal systems
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
    post:
      operationId: createSystem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, unit, description]
              properties:
                id: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9-]{2,62}$' }
                unit: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, minLength: 2, maxLength: 1000 }
      responses:
        '201': { description: System created }
        '409': { $ref: '#/components/responses/Conflict' }
  /systems/{systemId}:
    get:
      operationId: getSystem
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: System detail }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSystem
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '204': { description: System removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /systems/{systemId}/modules:
    get:
      operationId: listSystemModules
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: Modules in system }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createModule
      description: >-
        Register a module and provision its delivery application. Both are written in one
        PostgreSQL transaction, so a failure or a client timeout leaves neither behind.

        Supplying `Idempotency-Key` makes the call safely retryable: a retry with the same
        key and the same body returns `201` with the module the first attempt created,
        rather than `409 MODULE_EXISTS`. The same key with a different body is
        `409 IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/SystemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleCreate' }
      responses:
        '201': { description: Module created, or replayed for a retried idempotency key }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /systems/{systemId}/dora:
    get:
      operationId: getSystemDora
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: Four DORA metrics for system }
  /modules/{moduleId}:
    get:
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module detail }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '204': { description: Module removed }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleUpdate' }
      responses:
        '200': { description: Module settings persisted }
        '403': { description: Caller does not have access to the owning team }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{moduleId}/overview:
    get:
      operationId: getModuleOverview
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module overview read model }
  /modules/{moduleId}/pipeline-runs:
    post:
      operationId: startModulePipelineRun
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRunCreate' }
      responses:
        '202': { description: Pipeline accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listModulePipelineRuns
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module pipeline history }
  /modules/{moduleId}/versions:
    get:
      operationId: listModuleVersions
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module release versions and evidence }
    post:
      operationId: createModuleVersion
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCreate' }
      responses:
        '201': { description: Module version registered }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/versions/{tag}/ci-report:
    post:
      operationId: publishModuleCiReport
      description: Authenticated pipeline callback for version quality and security evidence.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: tag
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCiReport' }
      responses:
        '202': { description: CI report accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/config-revisions:
    get:
      operationId: listModuleConfigRevisions
      summary: List configuration revisions for a module
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Configuration revision history }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: proposeModuleConfigRevision
      summary: Propose a new immutable configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigRevisionCreate' }
      responses:
        '201': { description: Configuration revision created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/config-revisions/diff:
    get:
      operationId: diffModuleConfigRevisions
      summary: Diff two configuration revisions
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: fromRev
          in: query
          required: true
          schema: { type: integer }
        - name: toRev
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Structural diff between revisions }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{moduleId}/config-revisions/{revisionId}/approve:
    post:
      operationId: approveModuleConfigRevision
      summary: Approve a pending production configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200': { description: Configuration revision approved and activated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/config-revisions/{revisionId}/reject:
    post:
      operationId: rejectModuleConfigRevision
      summary: Reject a pending configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/RevisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigRevisionReject' }
      responses:
        '200': { description: Configuration revision rejected }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/config-revisions/{revisionNumber}/rollback:
    post:
      operationId: rollbackModuleConfigRevision
      summary: Rollback to a past configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/RevisionNumber'
      responses:
        '200': { description: New configuration revision created copying the target revision }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/drift:
    get:
      operationId: detectModuleDrift
      summary: Detect configuration and DCIM drift for a module
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Configuration and DCIM drift report }
        '404': { $ref: '#/components/responses/NotFound' }
  /servers/health:
    get:
      operationId: listServersHealth
      summary: Query server health records from DCIM collector
      parameters:
        - name: serverName
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Server health records }
  /modules/{moduleId}/dora:
    get:
      operationId: getModuleDora
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Four DORA metrics for module }
  /production-requests:
    get:
      operationId: listProductionRequests
      responses:
        '200': { description: Production approval queue }
    post:
      operationId: createProductionRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionRequestCreate' }
      responses:
        '201': { description: Scheduled production request created in waiting-approval state }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /production-requests/{requestId}/approve:
    post:
      operationId: approveProductionRequest
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '202': { description: Approval accepted }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-requests/{requestId}/reject:
    post:
      operationId: rejectProductionRequest
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '202': { description: Rejection accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /servers:
    get:
      operationId: listServers
      responses:
        '200': { description: Read-only projection of runtime targets already referenced by module configuration; unknown health is not promoted to online }
  /audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: systemId, in: query, required: false, schema: { type: string } }
        - { name: moduleId, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Audit events }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user identity and authentication status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /applications:
    post:
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listApplications
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
  /applications/{applicationId}/dora:
    get:
      operationId: getApplicationDora
      description: >-
        Four DORA metrics projected from durable delivery events. sourceEvents states
        how many events the figures came from, so a dashboard number is always traceable.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: DORA dashboard payload matching api/dora-dashboard.schema.json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoraDashboard'
        '404':
          $ref: '#/components/responses/NotFound'
  /delivery-events:
    get:
      operationId: listDeliveryEvents
      description: Source events behind the DORA projection, for acceptance evidence.
      parameters:
        - name: applicationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery source events
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryEvent'
  /applications/{applicationId}/pipeline-runs:
    post:
      operationId: startPipelineRun
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunCreate'
      responses:
        '202':
          description: Pipeline accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /applications/{applicationId}/scm:
    post:
      operationId: configureApplicationScm
      summary: Configure or update SCM integration for an application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScmIntegrationCreate'
      responses:
        '201':
          description: SCM integration configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScmIntegration'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: getApplicationScm
      summary: Get configured SCM integration for an application (secrets redacted)
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum: [github, gitlab]
      responses:
        '200':
          description: SCM integration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScmIntegration'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/scm/{provider}:
    post:
      operationId: receiveScmWebhook
      summary: Ingest external SCM webhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, gitlab]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Duplicate webhook ignored or acknowledged
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Pipeline triggered by verified webhook
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Webhook payload exceeds 1MB limit
  /pipeline-runs/{pipelineRunId}/callback-token:
    post:
      operationId: issuePipelineCallbackToken
      summary: Mint a scoped, short-lived callback token for one pipeline run
      description: >-
        Machine callbacks authenticate with a token bound to a single workload
        (`jenkins`/`temporal`), a single application, a single run or deployment, and an
        explicit set of scopes. A token for run A cannot write to run B, a Jenkins token
        cannot report a deployment result, and a token carrying a terminal scope is
        single-use.


        Normally the CI launcher mints this in-process when it dispatches a build; this
        endpoint exists so an operator can re-issue one whose lifetime expired. It is
        platform-admin only, because whoever can mint a token for a run can report that
        run's result. The token is returned once and never stored -- netCI keeps only its
        `jti`, which is what makes replay detectable.
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallbackTokenRequest' }
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackTokenResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /pipeline-runs/{pipelineRunId}:
    get:
      operationId: getPipelineRun
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pipeline run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/logs:
    get:
      operationId: getPipelineLogs
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pipeline logs
          content:
            application/json:
              schema:
                type: object
                required: [pipelineRunId, correlationId, lines]
                properties:
                  pipelineRunId: { type: string, format: uuid }
                  correlationId: { type: string }
                  lines: { type: array, items: { type: string } }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/cancel:
    post:
      operationId: cancelPipelineRun
      summary: Cancel a queued or running pipeline
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Pipeline run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/retry:
    post:
      operationId: retryPipelineRun
      summary: Retry a completed or cancelled pipeline creating a new run record with lineage
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Pipeline retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/stages:
    get:
      operationId: getPipelineStages
      summary: List granular stage execution events for a pipeline run
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Granular stage events
          content:
            application/json:
              schema:
                type: object
                required: [pipelineRunId, items]
                properties:
                  pipelineRunId: { type: string, format: uuid }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PipelineStage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: recordPipelineStageResult
      summary: Record stage execution event callback
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageResultRequest'
      responses:
        '202':
          description: Stage event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/stages/{stageId}:
    post:
      operationId: recordPipelineStageResultById
      summary: Record stage execution event callback with explicit stageId in path
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - name: stageId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageResultRequest'
      responses:
        '202':
          description: Stage event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/ci-result:
    post:
      operationId: recordCiResult
      description: Local callback seam for CI status and immutable artifact metadata; it performs no Jenkins or runtime I/O.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiResultRequest'
      responses:
        '202':
          description: CI result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}:
    get:
      operationId: getDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Deployment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/security-evidence:
    post:
      operationId: publishSecurityEvidence
      description: >-
        CI publishes SBOM, vulnerability-scan and signature evidence for one immutable
        artifact. netCI returns the supply-chain policy verdict and re-applies the same
        rules before any deployment is created.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityEvidence'
      responses:
        '202':
          description: Evidence recorded with a policy decision
          content:
            application/json:
              schema:
                type: object
                required: [pipelineRunId, decision, reason]
                properties:
                  pipelineRunId: { type: string, format: uuid }
                  decision: { type: string, enum: [allow, deny] }
                  reason: { type: string }
                  checks: { type: object, additionalProperties: { type: string } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: getSecurityEvidence
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
      responses:
        '200':
          description: Stored supply-chain evidence and its policy decision
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/NotFound'
  /deployments/{deploymentId}/approve:
    post:
      operationId: approveDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '202':
          description: Approval accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}/result:
    post:
      operationId: recordDeploymentResult
      description: Local callback seam for a runtime adapter result; it performs no deployment itself.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentResultRequest'
      responses:
        '202':
          description: Deployment result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}/heartbeat:
    post:
      operationId: heartbeatDeployment
      summary: Extend a running deployment's exclusive hold on its target
      description: >-
        A deployment holds a lease on `application + environment + target` while it runs,
        so two workflows cannot write to the same hosts. The lease expires if the worker
        stops heartbeating -- a lease without an expiry is a deadlock waiting for a worker
        to crash. `fencingToken` is the lease generation netCI handed the workflow when it
        started it; a lower one means this workflow has been superseded.
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '200': { description: Lease extended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deployments/{deploymentId}/rollback-result:
    post:
      operationId: recordRollbackResult
      summary: Report whether a rollback actually restored service
      description: >-
        A rollback that failed leaves the environment in neither the new state nor the old
        one. Reporting that as `failed` would lose the fact that recovery was attempted and
        did not work, so it has its own terminal state, `rollback_failed`, and it emits no
        DORA recovery event -- nothing was restored.
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackResultRequest' }
      responses:
        '202': { description: Rollback outcome recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deployment-leases/recover:
    post:
      operationId: recoverDeploymentLeases
      summary: Release leases whose owner stopped heartbeating
      description: >-
        Not what unblocks a target -- acquisition reclaims an expired lease at the moment
        somebody wants it, so no dead lease ever blocks work. This exists so an operator
        can see that a worker died without waiting for the next deployment to reveal it.
        Every release is written to the audit trail.
      responses:
        '200': { description: Leases recovered }
        '403': { $ref: '#/components/responses/Forbidden' }
  /deployments/{deploymentId}/rollback:
    post:
      operationId: rollbackDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '202':
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}/cancel:
    post:
      operationId: cancelDeployment
      summary: Cancel an in-flight deployment and release locks
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Deployment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /reconciler/reconcile:
    post:
      operationId: triggerReconciliation
      summary: Trigger background watchdog reconciliation across active pipelines and deployments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Reconciliation outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    PipelineBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    SystemId:
      name: systemId
      in: path
      required: true
      schema: { type: string }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionNumber:
      name: revisionNumber
      in: path
      required: true
      schema: { type: integer }
    ProductionRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineRunId:
      name: pipelineRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    BadRequest:
      description: Bad request or missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid machine callback credential
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency or domain conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request validation or domain validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >-
        The caller is authenticated but not permitted. For machine callbacks this is
        `WORKLOAD_NOT_PERMITTED` (wrong workload kind for the operation),
        `SCOPE_NOT_PERMITTED` (the token does not carry the scope) or `RESOURCE_MISMATCH`
        (the token was issued for a different run or deployment).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        The canonical PostgreSQL store could not be reached (`PERSISTENCE_UNAVAILABLE`).
        Reads as well as writes answer this: netCI reads state from the database on every
        request rather than from a cached copy, so it reports the outage instead of
        answering from a snapshot that may be stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [fencingToken]
      properties:
        fencingToken:
          type: integer
          minimum: 1
          description: Lease generation this workflow was started under.
    RollbackResultRequest:
      type: object
      additionalProperties: false
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
          description: Whether the previous version is actually back in service.
        message: { type: string, maxLength: 2000 }
        fencingToken: { type: integer, minimum: 1 }
    CallbackTokenRequest:
      type: object
      additionalProperties: false
      required: [workload, scopes]
      properties:
        workload:
          type: string
          enum: [jenkins, temporal]
          description: Which machine the token is for. A workload can only be issued scopes it may hold.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            enum: [ci:result, ci:logs, ci:evidence, ci:report, deployment:result, deployment:read]
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
    CallbackTokenResponse:
      type: object
      required: [token, workload, pipelineRunId, scopes, expiresInSeconds]
      properties:
        token:
          type: string
          description: Returned once. netCI stores only the token's jti, never the token.
        workload: { type: string }
        pipelineRunId: { type: string, format: uuid }
        scopes:
          type: array
          items: { type: string }
        expiresInSeconds: { type: integer }
    ModuleCreate:
      type: object
      required: [name, repositoryUrl, pipelineTemplate, runtime, deploymentEnvironments]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        displayName: { type: string, minLength: 1, maxLength: 255 }
        repositoryUrl: { type: string, format: uri }
        pipelineTemplate: { type: string, enum: [container-ci-cd-v1, kubernetes-ci-cd-v1, systemd-ansible-ci-cd-v1] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        moduleType: { type: string, default: Backend }
        description: { type: string }
        defaultEnvironment: { $ref: '#/components/schemas/Environment', default: dev }
        stages: { type: array, items: { type: string } }
        pipelineConfig: { $ref: '#/components/schemas/ModulePipelineConfig' }
        ownerTeam:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        deploymentEnvironments:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/DeploymentEnvironmentConfig' }
    ModuleUpdate:
      type: object
      additionalProperties: false
      required: [displayName, moduleType]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 255 }
        moduleType: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 1000, default: '' }
    DeploymentEnvironmentConfig:
      type: object
      additionalProperties: false
      required: [displayName, environment, runtime, servers, tasks]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        environment: { $ref: '#/components/schemas/Environment' }
        runtime: { $ref: '#/components/schemas/Runtime' }
        servers:
          type: array
          maxItems: 200
          items: { type: string }
        tasks:
          type: array
          maxItems: 100
          items: { type: string }
          deprecated: true
          description: Legacy display metadata; never executed by a runtime adapter.
        taskSettings:
          allOf:
            - $ref: '#/components/schemas/ModuleTaskSettings'
          deprecated: true
          description: Legacy display metadata; never executed by a runtime adapter.
        kubeconfigRef: { type: string, minLength: 1, maxLength: 255, nullable: true }
        namespace: { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63, nullable: true }
    ModuleTaskSettings:
      type: object
      additionalProperties: false
      properties:
        healthCheck:
          allOf:
            - $ref: '#/components/schemas/HealthCheckSettings'
          nullable: true
    HealthCheckSettings:
      type: object
      additionalProperties: false
      required: [script]
      properties:
        script: { type: string, minLength: 1, maxLength: 4000 }
        retries: { type: integer, minimum: 1, maximum: 20, default: 3 }
        delay: { type: string, pattern: '^\d+(ms|s|m)$', default: 10s }
    ModulePipelineTabConfig:
      type: object
      additionalProperties: false
      required: [branch, coverageReportPath, stages]
      properties:
        branch: { type: string, minLength: 1, maxLength: 500 }
        coverageReportPath: { type: string, minLength: 1, maxLength: 500 }
        stages:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
    ModulePipelineConfig:
      type: object
      additionalProperties: false
      required: [runner, strategy, pipelines]
      properties:
        runner: { type: string, minLength: 1, maxLength: 255 }
        strategy: { type: string, enum: [Gitflow, Trunk-based, Custom Pipeline] }
        pipelines:
          type: object
          minProperties: 1
          maxProperties: 10
          additionalProperties: { $ref: '#/components/schemas/ModulePipelineTabConfig' }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        engines:
          type: object
          description: Which CI/CD engines this instance is wired to.
          properties:
            ci: { type: string, enum: [none, jenkins] }
            cd: { type: string, enum: [none, temporal] }
        dependencies:
          type: object
          additionalProperties: true
    SecurityEvidence:
      type: object
      required: [artifactDigest, sbom, vulnerabilityScan, signature]
      properties:
        artifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        artifactRef: { type: string, nullable: true }
        buildRunId: { type: string, nullable: true }
        sbom:
          type: object
          required: [generatedBy, location]
          properties:
            generatedBy: { type: string, enum: [syft] }
            location: { type: string }
            format: { type: string, default: cyclonedx-json }
        vulnerabilityScan:
          type: object
          required: [scanner, status]
          properties:
            scanner: { type: string, enum: [trivy] }
            status: { type: string, enum: [passed, failed] }
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
            reportLocation: { type: string, nullable: true }
        signature:
          type: object
          required: [provider, verified]
          properties:
            provider: { type: string, enum: [cosign] }
            verified: { type: boolean }
            certificateIdentity: { type: string, nullable: true }
            bundleLocation: { type: string, nullable: true }
    DeliveryEvent:
      type: object
      required: [id, eventType, applicationId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [commit, deployment, recovery] }
        applicationId: { type: string, format: uuid }
        pipelineRunId: { type: string, format: uuid, nullable: true }
        deploymentId: { type: string, format: uuid, nullable: true }
        commitSha: { type: string, nullable: true }
        environment: { $ref: '#/components/schemas/Environment' }
        successful: { type: boolean, nullable: true }
        requiresIntervention: { type: boolean }
        occurredAt: { type: string, format: date-time }
    DoraDashboard:
      type: object
      required: [applicationId, period, metrics, sourceEvents]
      properties:
        applicationId: { type: string, format: uuid }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        metrics:
          type: object
          required: [deploymentFrequency, changeLeadTimeSecondsAvg, changeFailRate, timeToRestoreServiceSecondsAvg]
          properties:
            deploymentFrequency: { type: number, minimum: 0 }
            changeLeadTimeSecondsAvg: { type: number, minimum: 0 }
            changeFailRate: { type: number, minimum: 0, maximum: 1 }
            timeToRestoreServiceSecondsAvg: { type: number, minimum: 0 }
        sourceEvents: { type: integer, minimum: 0 }
    Runtime:
      type: string
      enum: [docker, kubernetes, systemd]
    Environment:
      type: string
      enum: [dev, staging, prod]
    ApplicationCreate:
      type: object
      required: [name, repositoryUrl, pipelineTemplate, runtime]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        repositoryUrl: { type: string, format: uri }
        pipelineTemplate: { type: string, enum: [container-ci-cd-v1, kubernetes-ci-cd-v1, systemd-ansible-ci-cd-v1] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        defaultEnvironment: { $ref: '#/components/schemas/Environment', default: dev }
        ownerTeam:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Team accountable for this application. A caller may only hand an application to
            a team they belong to, and only members of that team (or a platform-admin) can
            run its pipelines, approve its deployments or roll them back. Null means
            unowned: role checks still apply, team checks do not, so applications created
            before ownership existed keep working. Set NETCI_REQUIRE_APPLICATION_OWNER once
            every application has an owner, and this becomes required.
        stages:
          type: array
          items: { type: string }
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationCreate'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    StageDefinition:
      type: object
      required: [id, name, category, enabledByDefault]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [source, test, build, security, publish, deploy, verify] }
        enabledByDefault: { type: boolean }
        parameters: { type: object, additionalProperties: true }
    TemplateDefinition:
      type: object
      required: [id, name, runtime, stageIds]
      properties:
        id: { type: string }
        name: { type: string }
        runtime: { $ref: '#/components/schemas/Runtime' }
        stageIds: { type: array, items: { type: string } }
    PipelineRunCreate:
      type: object
      required: [commitSha, environment]
      properties:
        commitSha: { type: string, minLength: 7 }
        branch: { type: string, default: main }
        environment: { $ref: '#/components/schemas/Environment' }
        parameters: { type: object, additionalProperties: true }
    PipelineRun:
      type: object
      required: [id, applicationId, status, commitSha, createdAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, waiting_approval, succeeded, failed, cancelled, rolled_back] }
        commitSha: { type: string }
        branch: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        parameters: { type: object, additionalProperties: true }
        jenkinsRunId: { type: string, nullable: true }
        workflowId: { type: string, nullable: true }
        artifactDigest: { type: string, nullable: true }
        consoleUrl: { type: string, nullable: true }
        retryOf: { type: string, format: uuid, nullable: true }
        startedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 256 }
    PipelineStage:
      type: object
      required: [id, pipelineRunId, stageId, stageName, attempt, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        pipelineRunId: { type: string, format: uuid }
        stageId: { type: string }
        stageName: { type: string }
        attempt: { type: integer, minimum: 1 }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, skipped] }
        queuedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, minimum: 0, nullable: true }
        errorMessage: { type: string, nullable: true }
        logSnippet: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StageResultRequest:
      type: object
      required: [stageName, status]
      additionalProperties: false
      properties:
        stageId: { type: string, minLength: 1, maxLength: 64 }
        stageName: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, skipped] }
        attempt: { type: integer, minimum: 1, default: 1 }
        queuedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, minimum: 0, nullable: true }
        errorMessage: { type: string, nullable: true }
        logSnippet: { type: string, nullable: true }
    ReconcileRequest:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 500, default: 50 }
        timeoutSeconds: { type: integer, minimum: 1, nullable: true }
    ReconcileResponse:
      type: object
      required: [reconciledRuns, reconciledDeployments]
      properties:
        reconciledRuns:
          type: array
          items: { type: object, additionalProperties: true }
        reconciledDeployments:
          type: array
          items: { type: object, additionalProperties: true }
    CiResultRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [running, succeeded, failed] }
        artifactDigest: { type: string, nullable: true, pattern: '^sha256:[0-9a-f]{64}$' }
        logLines:
          type: array
          maxItems: 1000
          items: { type: string }
    CiResultResponse:
      type: object
      required: [pipelineRun, deployment]
      additionalProperties: false
      properties:
        pipelineRun: { $ref: '#/components/schemas/PipelineRun' }
        deployment:
          allOf:
            - $ref: '#/components/schemas/Deployment'
          nullable: true
    Deployment:
      type: object
      required: [id, applicationId, runtime, environment, status]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        runtime: { $ref: '#/components/schemas/Runtime' }
        environment: { $ref: '#/components/schemas/Environment' }
        status: { type: string, enum: [pending_approval, deploying, healthy, failed, rolled_back] }
        artifactDigest: { type: string }
        approvedBy: { type: string, nullable: true }
    DeploymentResultRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [healthy, failed] }
        message: { type: string, nullable: true, maxLength: 2000 }
    VersionCiReport:
      type: object
      required: [coverage, autoTest, sast, sastIssues, vulnerabilities, commit]
      additionalProperties: false
      properties:
        coverage: { type: number, minimum: 0, maximum: 100 }
        autoTest: { type: string, enum: [passed, failed, skipped] }
        sast: { type: string, enum: [passed, failed] }
        sastIssues: { type: integer, minimum: 0 }
        vulnerabilities:
          type: object
          required: [critical, high, medium]
          additionalProperties: false
          properties:
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
        commit: { type: string, pattern: '^[0-9a-fA-F]{7,64}$' }
    VersionCreate:
      type: object
      required: [tag, gitTagUrl, artifactUrl]
      additionalProperties: false
      properties:
        tag: { type: string, pattern: '^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$' }
        gitTagUrl: { type: string, format: uri }
        artifactUrl: { type: string, format: uri }
        pipelineRunId: { type: string, format: uuid, nullable: true }
        artifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$', nullable: true }
    ProductionRequestCreate:
      type: object
      required: [modules, scheduledFor]
      additionalProperties: false
      properties:
        modules:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/ProductionRequestModuleCreate' }
        scheduledFor: { type: string, format: date-time }
        rollbackStrategy: { type: string, enum: [automatic, manual], default: automatic }
        runAutomationTests: { type: boolean, default: true }
    ProductionRequestModuleCreate:
      type: object
      required: [moduleId, version, deploymentOrder]
      additionalProperties: false
      properties:
        moduleId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        version: { type: string, pattern: '^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$' }
        deploymentOrder: { type: integer, minimum: 1, maximum: 100 }
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 1000 }
    RollbackRequest:
      type: object
      required: [targetArtifactDigest, reason]
      properties:
        targetArtifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        reason: { type: string, minLength: 3 }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, nullable: true }
    ScmIntegrationCreate:
      type: object
      required: [provider, repositoryIdentity, secretToken]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [github, gitlab] }
        repositoryIdentity: { type: string, minLength: 1, maxLength: 255 }
        secretToken: { type: string, minLength: 8, maxLength: 255 }
        credentialReference: { type: string, nullable: true, maxLength: 128 }
        enabled: { type: boolean, default: true }
    ScmIntegration:
      type: object
      required: [id, applicationId, provider, repositoryIdentity, enabled, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        provider: { type: string, enum: [github, gitlab] }
        repositoryIdentity: { type: string }
        credentialReference: { type: string, nullable: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConfigRevisionCreate:
      type: object
      additionalProperties: false
      properties:
        changeSummary: { type: string, maxLength: 1000 }
        pipelineConfig: { type: object, additionalProperties: true }
        deploymentConfig: { type: array, items: { type: object, additionalProperties: true } }
    ConfigRevisionReject:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ConfigRevision:
      type: object
      required: [id, revisionNumber, status, active, changeSummary, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        revisionNumber: { type: integer }
        status: { type: string, enum: [draft, pending_approval, active, superseded, rejected] }
        active: { type: boolean }
        changeSummary: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        pipelineConfig: { type: object, additionalProperties: true }
        deploymentConfig: { type: array, items: { type: object, additionalProperties: true } }
    ServerHealthRecord:
      type: object
      required: [serverName, status, source, freshnessSeconds, observedAt]
      properties:
        serverName: { type: string }
        status: { type: string }
        source: { type: string }
        freshnessSeconds: { type: integer }
        details: { type: object, additionalProperties: true }
        observedAt: { type: string, format: date-time }
