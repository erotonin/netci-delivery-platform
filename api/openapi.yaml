    get:
      operationId: listSampleApps
      summary: Sample applications shipped in this checkout, discovered from disk
      description: >-
        Read from `sample-apps/` at request time. `repositoryUrl` is derived from
        `NETCI_SAMPLE_APPS_REPOSITORY_BASE`; when that is unset it is `null` and the wizard
        says so rather than offering a repository Jenkins could not clone.
      responses:
        '200':
          description: Sample applications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SampleApps' }
  /modules/{moduleId}/config/apply:
    post:
      operationId: applyModuleConfiguration
      summary: Deploy an existing artifact with a configuration revision
      description: >-
        Applies a configuration revision to an environment by redeploying the artifact that
        is already there (or the most recent succeeded build) through the normal path: lease,
        state machine, workflow, and a health result reported by the worker. The response
        status is `deploying` or `pending_approval`, never `healthy` -- health is not asserted
        here. With no built artifact the request is refused with `409 NO_DEPLOYABLE_ARTIFACT`;
        nothing is invented to deploy.
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigApplyRequest' }
      responses:
        '200':
          description: >-
            A redeploy of the last built artifact was started (or is waiting for approval in
            production). Nothing here means "applied": the deployment's status says what the
            worker has established so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigApplyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/agents/token:
    post:
      operationId: issueAgentToken
      summary: Mint the token an edge agent presents when it connects
      description: >-
        The hostname is a signed claim, so an agent can only register as the host it was
        issued for. Platform-admin only. Returned once and never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTokenRequest' }
      responses:
        '201': { description: Token issued }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/agents/status:
    get:
      operationId: listConnectedAgents
      summary: Edge agents connected to any API replica
      description: >-
        Connections are rows in the platform database (ADR-032): every replica lists every
        agent, with the replica that holds its socket, and marks `stale` an agent whose
        replica stopped refreshing it. Only reported facts appear; `telemetry` is null until
        the agent has sent a heartbeat.
      responses:
        '200':
          description: Connected agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  replicaId: { type: string }
                  count: { type: integer }
                  connectedAgents: { type: integer }
                  staleAgents: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        hostname: { type: string }
                        agentId: { type: string }
                        replicaId: { type: string }
                        connectedAt: { type: string, format: date-time }
                        lastSeenAt: { type: string, format: date-time }
                        stale: { type: boolean }
                        local: { type: boolean }
                        telemetry:
                          type: object
                          nullable: true
                          properties:
                            cpuPercent: { type: number }
                            memPercent: { type: number }
                            diskPercent: { type: number }
                            observedAt: { type: string, format: date-time }
  /api/v1/agents/execute:
    post:
      operationId: executeAgentCommand
      summary: Run an allow-listed read-only diagnostic command on a connected agent
      description: >-
        A remote execution channel, however narrow. Platform-admin only; the hostname must
        match a connected agent exactly; the command must pass the agent allowlist
        (`docker ps|inspect|stats`, `systemctl status|is-active`, and similar read-only
        binaries). Every execution is audited. The agent may be held by another replica:
        the command is a durable row that the holding replica claims exactly once and
        answers; `claimedBy` names it, `requestedOn` names the replica that answered you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCommandExecute' }
      responses:
        '200':
          description: Command output
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string, format: uuid }
                  hostname: { type: string }
                  command: { type: string }
                  exitCode: { type: integer }
                  output: { type: string }
                  durationMs: { type: number }
                  requestedOn: { type: string }
                  claimedBy: { type: string }
        '400': { description: Command refused by the allowlist (`COMMAND_POLICY_VIOLATION`) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No agent connected for that hostname (`AGENT_NOT_CONNECTED`) }
  /api/v1/agents/install.sh:
    get:
      operationId: getAgentInstallScript
      summary: Shell installer for the edge agent daemon
      responses:
        '200':
          description: Installer script
          content:
            text/x-shellscript:
              schema: { type: string }
  /api/v1/security/waivers:
    get:
      operationId: listSecurityWaivers
      summary: CVE waivers, optionally filtered by module
      parameters:
        - { name: moduleId, in: query, required: false, schema: { type: string } }
        - { name: activeOnly, in: query, required: false, schema: { type: boolean } }
      responses:
        '200': { description: Waivers }
    post:
      operationId: createSecurityWaiver
      summary: Waive a CVE for a bounded time
      description: >-
        Reviewer or platform-admin. The approver is the authenticated principal; `expiresAt`
        is mandatory because a waiver without an end is a permanent exception nobody
        decided on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecurityWaiverCreate' }
      responses:
        '201': { description: Waiver recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/security/waivers/{waiverId}/revoke:
    post:
      operationId: revokeSecurityWaiver
      summary: Revoke a waiver before it expires
      parameters:
        - { name: waiverId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Waiver revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/ci/controllers/reload:
    post:
      operationId: reloadCiControllers
      summary: Make every Jenkins controller re-read its git-managed JCasC, then compare them
      description: >-
        Called by the configuration repository's push webhook (HMAC-SHA256 over the body in
        `X-Hub-Signature-256` or `X-NetCI-Signature`, secret `NETCI_CASC_WEBHOOK_SECRET`) or by
        a platform admin. Configuration is rebuilt or reloaded from git, never edited in place
        (ADR-033). The reload is audited (`ci.controllers.reloaded`) and followed by the
        controller drift comparison; a controller that refused the reload is reported.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: the git host's push payload, opaque to netCI }
      responses:
        '200':
          description: Per-controller reload outcome and the drift comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string }
                  actor: { type: string }
                  ok: { type: boolean }
                  controllers:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        reloaded: { type: boolean }
                        error: { type: string }
                  drift: { type: object, additionalProperties: true }
        '401': { description: No valid signature and no credential (`CASC_RELOAD_UNAUTHORIZED`) }
        '403': { description: Authenticated but not a platform admin }
        '501': { description: CI is not Jenkins (`CI_NOT_JENKINS`) }
  /api/v1/ci/controllers/drift:
    get:
      operationId: getCiControllerDrift
      summary: Compare the configuration every Jenkins controller actually loaded (platform-admin)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [mode, controllers, drift, differing, unreachable]
                properties:
                  mode: { type: string }
                  controllers:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        jcascNormalizedSha256: { type: string }
                        pluginsSha256: { type: string }
                        pluginCount: { type: integer }
                        jobs: { type: array, items: { type: string } }
                  unreachable: { type: object, additionalProperties: { type: string } }
                  drift: { type: boolean }
                  differing: { type: array, items: { type: string, enum: [jcascNormalizedSha256, pluginsSha256, jobs] } }
  /api/v1/servers/maintenance:
    get:
      operationId: listServerMaintenance
      summary: Servers currently in maintenance mode
      responses:
        '200': { description: Maintenance states }
  /api/v1/servers/{server_name}/maintenance:
    post:
      operationId: setServerMaintenance
      summary: Put a server into, or take it out of, maintenance mode
      description: >-
        Platform-admin only: maintenance mode decides where deployments may go. The actor is
        the authenticated principal; it is not accepted from the body.
      parameters:
        - { name: server_name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerMaintenanceRequest' }
      responses:
        '200': { description: Maintenance state updated }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/servers/{server_name}/telemetry:
    get:
      operationId: getServerTelemetry
      summary: Latest telemetry heartbeat received from a server's edge agent
      parameters:
        - { name: server_name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The latest telemetry an agent reported for this server }
        '404': { description: No agent has ever reported for this server (`TELEMETRY_UNKNOWN`); never answered with invented numbers }

components:
  securitySchemes:
    PipelineBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    SystemId:
      name: systemId
      in: path
      required: true
      schema: { type: string }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionNumber:
      name: revisionNumber
      in: path
      required: true
      schema: { type: integer }
    ProductionRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineRunId:
      name: pipelineRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    BadRequest:
      description: Bad request or missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid machine callback credential
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency or domain conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request validation or domain validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >-
        The caller is authenticated but not permitted. For machine callbacks this is
        `WORKLOAD_NOT_PERMITTED` (wrong workload kind for the operation),
        `SCOPE_NOT_PERMITTED` (the token does not carry the scope) or `RESOURCE_MISMATCH`
        (the token was issued for a different run or deployment).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        The canonical PostgreSQL store could not be reached (`PERSISTENCE_UNAVAILABLE`).
        Reads as well as writes answer this: netCI reads state from the database on every
        request rather than from a cached copy, so it reports the outage instead of
        answering from a snapshot that may be stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BuildIdentity:
      type: object
      required: [currentCommitSha, currentBranch, source]
      properties:
        currentCommitSha: { type: string, nullable: true }
        currentBranch: { type: string, nullable: true }
        source: { type: string, nullable: true, enum: [environment, git, null] }
    SampleApps:
      type: object
      required: [repositoryBaseConfigured, items]
      properties:
        repositoryBaseConfigured: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [id, name, runtime, pipelineTemplate, path, repositoryUrl, hasTests]
            properties:
              id: { type: string }
              name: { type: string }
              runtime: { type: string, enum: [docker, kubernetes, systemd] }
              pipelineTemplate: { type: string }
              path: { type: string }
              repositoryUrl: { type: string, nullable: true }
              hasTests: { type: boolean }
    ConfigApplyResponse:
      type: object
      required: [deploymentId, moduleId, environment, revisionNumber, status, artifactDigest, sourcePipelineRunId, message]
      properties:
        deploymentId: { type: string, format: uuid }
        moduleId: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        revisionNumber: { type: integer }
        status: { type: string, enum: [pending_approval, deploying] }
        artifactDigest: { type: string }
        sourcePipelineRunId: { type: string, format: uuid }
        fencingToken: { type: integer, nullable: true }
        configBypassedCi: { type: boolean }
        riskLevel: { type: string, nullable: true }
        riskReasons: { type: array, items: { type: string } }
        message: { type: string }
    ConfigApplyRequest:
      type: object
      additionalProperties: false
      properties:
        environment: { type: string, enum: [dev, staging, prod], default: prod }
        revisionId: { type: string, format: uuid, nullable: true }
        fencingToken: { type: integer, nullable: true }
    AgentTokenRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9][A-Za-z0-9.-]*$' }
        ttlSeconds: { type: integer, minimum: 300, maximum: 86400, default: 86400 }
    AgentCommandExecute:
      type: object
      additionalProperties: false
      required: [hostname, command]
      properties:
        hostname: { type: string }
        command: { type: string }
        timeout: { type: number, default: 30 }
    SecurityWaiverCreate:
      type: object
      additionalProperties: false
      required: [cveId, reason, expiresAt]
      properties:
        cveId: { type: string, minLength: 3, maxLength: 64 }
        reason: { type: string, minLength: 5, maxLength: 1000 }
        expiresAt: { type: string, format: date-time }
        moduleId: { type: string, nullable: true }
    ServerMaintenanceRequest:
      type: object
      additionalProperties: false
      required: [inMaintenance]
      properties:
        inMaintenance: { type: boolean }
        reason: { type: string, maxLength: 1000, default: '' }
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [fencingToken]
      properties:
        fencingToken:
          type: integer
          minimum: 1
          description: Lease generation this workflow was started under.
    RollbackResultRequest:
      type: object
      additionalProperties: false
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
          description: Whether the previous version is actually back in service.
        message: { type: string, maxLength: 2000 }
        fencingToken: { type: integer, minimum: 1 }
    CallbackTokenRequest:
      type: object
      additionalProperties: false
      required: [workload, scopes]
      properties:
        workload:
          type: string
          enum: [jenkins, temporal]
          description: Which machine the token is for. A workload can only be issued scopes it may hold.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            enum: [ci:result, ci:logs, ci:evidence, ci:report, deployment:result, deployment:read]
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
    CallbackTokenResponse:
      type: object
      required: [token, workload, pipelineRunId, scopes, expiresInSeconds]
      properties:
        token:
          type: string
          description: Returned once. netCI stores only the token's jti, never the token.
        workload: { type: string }
        pipelineRunId: { type: string, format: uuid }
        scopes:
          type: array
          items: { type: string }
        expiresInSeconds: { type: integer }
    ModuleCreate:
      type: object
      required: [name, repositoryUrl, pipelineTemplate, runtime, deploymentEnvironments]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        displayName: { type: string, minLength: 1, maxLength: 255 }
        repositoryUrl: { type: string, format: uri }
        pipelineTemplate: { type: string, enum: [container-ci-cd-v1, kubernetes-ci-cd-v1, systemd-ansible-ci-cd-v1] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        moduleType: { type: string, default: Backend }
        description: { type: string }
        defaultEnvironment: { $ref: '#/components/schemas/Environment', default: dev }
        stages: { type: array, items: { type: string } }
        pipelineConfig: { $ref: '#/components/schemas/ModulePipelineConfig' }
        ownerTeam:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        deploymentEnvironments:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/DeploymentEnvironmentConfig' }
    ModuleUpdate:
      type: object
      additionalProperties: false
      required: [displayName, moduleType]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 255 }
        moduleType: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 1000, default: '' }
    DeploymentEnvironmentConfig:
      type: object
      additionalProperties: false
      required: [displayName, environment, runtime, servers, tasks]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        environment: { $ref: '#/components/schemas/Environment' }
        runtime: { $ref: '#/components/schemas/Runtime' }
        servers:
          type: array
          maxItems: 200
          items: { type: string }
        tasks:
          type: array
          maxItems: 100
          items: { type: string }
          deprecated: true
          description: Legacy display metadata; never executed by a runtime adapter.
        taskSettings:
          allOf:
            - $ref: '#/components/schemas/ModuleTaskSettings'
          deprecated: true
          description: Legacy display metadata; never executed by a runtime adapter.
        kubeconfigRef: { type: string, minLength: 1, maxLength: 255, nullable: true }
        namespace: { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63, nullable: true }
        runtimeSettings:
          allOf:
            - $ref: '#/components/schemas/RuntimeSettings'
          nullable: true
    RuntimeSettings:
      type: object
      additionalProperties: false
      description: >-
        How the checked-in playbook lays the service out on the target. These are the only
        playbook inputs a module may configure, and they live in the reviewed configuration
        revision, never in a pipeline trigger (build inputs reject them).
      properties:
        appRoot:
          type: string
          minLength: 2
          maxLength: 255
          pattern: '^/[A-Za-z0-9._/-]+$'
          nullable: true
          description: Absolute install path; `..` segments are refused.
        hostPort: { type: integer, minimum: 1024, maximum: 65535, nullable: true }
        containerPort: { type: integer, minimum: 1, maximum: 65535, nullable: true }
        networkMode: { type: string, enum: [bridge, host], nullable: true }
        appPort: { type: integer, minimum: 1024, maximum: 65535, nullable: true }
        systemdScope: { type: string, enum: [system, user], nullable: true }
        become: { type: boolean, nullable: true }
        imagePullHost:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$'
          nullable: true
          description: >-
            Host[:port] under which this target's container runtime reaches the registry in the
            artifact reference. Only the locator changes; the digest is unchanged and verified on pull.
    DeploymentTargetRevision:
      type: object
      additionalProperties: true
      description: >-
        One environment's target inside a proposed configuration revision. Fields the runtime
        adapter reads are validated like DeploymentEnvironmentConfig; other keys are kept for
        the risk classifier and never reach a playbook.
      required: [environment]
      properties:
        environment: { $ref: '#/components/schemas/Environment' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        runtime: { $ref: '#/components/schemas/Runtime' }
        servers:
          type: array
          maxItems: 200
          items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,252}$' }
        tasks: { type: array, maxItems: 100, items: { type: string } }
        taskSettings: { $ref: '#/components/schemas/ModuleTaskSettings' }
        kubeconfigRef: { type: string, minLength: 1, maxLength: 255, nullable: true }
        namespace: { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63, nullable: true }
        runtimeSettings:
          allOf:
            - $ref: '#/components/schemas/RuntimeSettings'
          nullable: true
    ModuleTaskSettings:
      type: object
      additionalProperties: false
      properties:
        healthCheck:
          allOf:
            - $ref: '#/components/schemas/HealthCheckSettings'
          nullable: true
    HealthCheckSettings:
      type: object
      additionalProperties: false
      required: [script]
      properties:
        script: { type: string, minLength: 1, maxLength: 4000 }
        retries: { type: integer, minimum: 1, maximum: 20, default: 3 }
        delay: { type: string, pattern: '^\d+(ms|s|m)$', default: 10s }
    ModulePipelineTabConfig:
      type: object
      additionalProperties: false
      required: [branch, coverageReportPath, stages]
      properties:
        branch: { type: string, minLength: 1, maxLength: 500 }
        coverageReportPath: { type: string, minLength: 1, maxLength: 500 }
        stages:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
    ModulePipelineConfig:
      type: object
      additionalProperties: false
      required: [runner, strategy, pipelines]
      properties:
        runner: { type: string, minLength: 1, maxLength: 255 }
        strategy: { type: string, enum: [Gitflow, Trunk-based, Custom Pipeline] }
        pipelines:
          type: object
          minProperties: 1
          maxProperties: 10
          additionalProperties: { $ref: '#/components/schemas/ModulePipelineTabConfig' }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        engines:
          type: object
          description: Which CI/CD engines this instance is wired to.
          properties:
            ci: { type: string, enum: [none, jenkins] }
            cd: { type: string, enum: [none, temporal] }
        dependencies:
          type: object
          additionalProperties: true
    SecurityEvidence:
      type: object
      required: [artifactDigest, sbom, vulnerabilityScan, signature]
      properties:
        artifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        artifactRef: { type: string, nullable: true }
        buildRunId: { type: string, nullable: true }
        sbom:
          type: object
          required: [generatedBy, location]
          properties:
            generatedBy: { type: string, enum: [syft] }
            location: { type: string }
            format: { type: string, default: cyclonedx-json }
        vulnerabilityScan:
          type: object
          required: [scanner, status]
          properties:
            scanner: { type: string, enum: [trivy] }
            status: { type: string, enum: [passed, failed] }
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
            reportLocation: { type: string, nullable: true }
        signature:
          type: object
          required: [provider, verified]
          properties:
            provider: { type: string, enum: [cosign] }
            verified: { type: boolean }
            certificateIdentity: { type: string, nullable: true }
            bundleLocation: { type: string, nullable: true }
    DeliveryEvent:
      type: object
      required: [id, eventType, applicationId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [commit, deployment, recovery] }
        applicationId: { type: string, format: uuid }
        pipelineRunId: { type: string, format: uuid, nullable: true }
        deploymentId: { type: string, format: uuid, nullable: true }
        commitSha: { type: string, nullable: true }
        environment: { $ref: '#/components/schemas/Environment' }
        successful: { type: boolean, nullable: true }
        requiresIntervention: { type: boolean }
        occurredAt: { type: string, format: date-time }
    DoraDashboard:
      type: object
      required: [applicationId, period, metrics, sourceEvents]
      properties:
        applicationId: { type: string, format: uuid }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        metrics:
          type: object
          required: [deploymentFrequency, changeLeadTimeSecondsAvg, changeFailRate, timeToRestoreServiceSecondsAvg]
          properties:
            deploymentFrequency: { type: number, minimum: 0 }
            changeLeadTimeSecondsAvg: { type: number, minimum: 0 }
            changeFailRate: { type: number, minimum: 0, maximum: 1 }
            timeToRestoreServiceSecondsAvg: { type: number, minimum: 0 }
        sourceEvents: { type: integer, minimum: 0 }
    Runtime:
      type: string
      enum: [docker, kubernetes, systemd]
    Environment:
      type: string
      enum: [dev, staging, prod]
    ApplicationCreate:
      type: object
      required: [name, repositoryUrl, pipelineTemplate, runtime]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        repositoryUrl: { type: string, format: uri }
        pipelineTemplate: { type: string, enum: [container-ci-cd-v1, kubernetes-ci-cd-v1, systemd-ansible-ci-cd-v1] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        defaultEnvironment: { $ref: '#/components/schemas/Environment', default: dev }
        ownerTeam:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Team accountable for this application. A caller may only hand an application to
            a team they belong to, and only members of that team (or a platform-admin) can
            run its pipelines, approve its deployments or roll them back. Null means
            unowned: role checks still apply, team checks do not, so applications created
            before ownership existed keep working. Set NETCI_REQUIRE_APPLICATION_OWNER once
            every application has an owner, and this becomes required.
        stages:
          type: array
          items: { type: string }
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationCreate'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    StageDefinition:
      type: object
      required: [id, name, category, kind, required, enabledByDefault, position]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [source, test, build, security, publish, deploy, verify, custom] }
        kind: { type: string, enum: [builtin, custom] }
        description: { type: string }
        script: { type: string, nullable: true, description: Custom stages only; repository-relative script path }
        afterStage: { type: string, nullable: true, description: Custom stages only; the built-in stage it runs after }
        required: { type: boolean, description: Cannot be removed from a module's pipeline }
        enabledByDefault: { type: boolean }
        position: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        status: { type: string, enum: [proposed, active, rejected], description: Custom stages run only when active }
        approvedBy: { type: string, nullable: true }
        parameters:
          type: array
          items: { type: object, properties: { name: { type: string }, default: { type: string }, description: { type: string } } }
    CustomStageCreate:
      type: object
      additionalProperties: false
      required: [id, name, script, afterStage]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        category: { type: string, enum: [source, test, build, security, publish, deploy, verify, custom], default: custom }
