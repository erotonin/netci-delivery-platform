openapi: 3.0.3
info:
  title: netCI Delivery API
  version: 0.1.0
  description: API-first contract for netCI Delivery Platform.
servers:
  - url: http://localhost:8000

paths:
  /livez:
    get:
      summary: Basic process liveness probe
      operationId: livez
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /readyz:
    get:
      summary: Truthful readiness probe for accepting work
      operationId: readyz
      responses:
        '200':
          description: Service is ready to accept and execute work
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Required dependency is unavailable
          content:
            application/json:
              schema:
                type: object
  /operator/health:
    get:
      summary: Detailed authenticated operator health probe
      operationId: operatorHealth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detailed diagnostic health report with redacted secrets
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Required dependency is unavailable
          content:
            application/json:
              schema:
                type: object
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy and every configured dependency is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A configured dependency is unreachable; writes would fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /stage-catalog:
    get:
      operationId: listStageCatalog
      responses:
        '200':
          description: Available stages (built-in and custom) and templates
          content:
            application/json:
              schema:
                type: object
                required: [stages, templates]
                properties:
                  stages:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageDefinition'
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateDefinition'
    post:
      operationId: registerCustomStage
      summary: Register a custom stage (platform-admin) that runs a repository script after a built-in stage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomStageCreate' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageDefinition' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /stage-catalog/{stageId}/approve:
    post:
      operationId: approveCustomStage
      summary: Approve a proposed custom stage (a platform-admin other than the proposer)
      parameters:
        - { name: stageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageDefinition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /stage-catalog/{stageId}:
    delete:
      operationId: removeCustomStage
      summary: Remove a custom stage no module uses (platform-admin)
      parameters:
        - { name: stageId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/stages:
    get:
      operationId: getModuleStages
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [moduleId, applicationId, stages, pipelineTemplate]
                properties:
                  moduleId: { type: string }
                  applicationId: { type: string, format: uuid }
                  stages: { type: array, items: { type: string } }
                  pipelineTemplate: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setModuleStages
      summary: Choose which catalog stages this module's pipeline runs (takes effect on the next run)
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stages]
              properties:
                stages: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
                stageParameters:
                  type: object
                  description: Values for declared parameters of the custom stages in `stages`
                  additionalProperties: { type: object, additionalProperties: { type: string, maxLength: 256 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [moduleId, applicationId, stages]
                properties:
                  moduleId: { type: string }
                  applicationId: { type: string, format: uuid }
                  stages: { type: array, items: { type: string } }
                  stageParameters: { type: object, additionalProperties: { type: object, additionalProperties: { type: string } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /dcim/services:
    get:
      operationId: searchDcimServices
      description: Search the configured DCIM service catalog; returns not_configured with no items when absent.
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, default: '' }
      responses:
        '200': { description: Matching DCIM services and source metadata }
  /dcim/modules:
    get:
      operationId: listDcimModules
      description: List modules returned by the configured DCIM integration.
      parameters:
        - name: systemId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: DCIM modules and source metadata }
        '404': { $ref: '#/components/responses/NotFound' }
  /dcim/servers:
    get:
      operationId: listDcimServers
      description: List real server inventory for a system and optional module from the configured DCIM integration.
      parameters:
        - name: systemId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: moduleId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: DCIM servers and source metadata }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Configured DCIM integration is unreachable or returned an invalid response }
  /systems:
    get:
      operationId: listSystems
      responses:
        '200':
          description: Release Portal systems
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
    post:
      operationId: createSystem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, unit, description]
              properties:
                id: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9-]{2,62}$' }
                unit: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, minLength: 2, maxLength: 1000 }
      responses:
        '201': { description: System created }
        '409': { $ref: '#/components/responses/Conflict' }
  /systems/{systemId}:
    get:
      operationId: getSystem
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: System detail }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSystem
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '204': { description: System removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /systems/{systemId}/modules:
    get:
      operationId: listSystemModules
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: Modules in system }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createModule
      description: >-
        Register a module and provision its delivery application. Both are written in one
        PostgreSQL transaction, so a failure or a client timeout leaves neither behind.

        Supplying `Idempotency-Key` makes the call safely retryable: a retry with the same
        key and the same body returns `201` with the module the first attempt created,
        rather than `409 MODULE_EXISTS`. The same key with a different body is
        `409 IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/SystemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleCreate' }
      responses:
        '201': { description: Module created, or replayed for a retried idempotency key }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /systems/{systemId}/dora:
    get:
      operationId: getSystemDora
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: Four DORA metrics for system }
  /modules/{moduleId}:
    get:
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module detail }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '204': { description: Module removed }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleUpdate' }
      responses:
        '200': { description: Module settings persisted }
        '403': { description: Caller does not have access to the owning team }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{moduleId}/git-refs:
    get:
      operationId: getModuleGitRefs
      summary: Branches and tags of the module's repository with the commit each points at
      description: >-
        Read by the server with `git ls-remote` (anonymous, read-only, http(s)/ssh only). What
        the "run this branch" dialog offers; the Portal used to propose netCI's own build
        commit, which does not exist in the module's repository. A repository that cannot
        be read answers with `error` and empty lists, never a guess.
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          description: Refs
          content:
            application/json:
              schema:
                type: object
                properties:
                  moduleId: { type: string }
                  repositoryUrl: { type: string }
                  branches: { type: array, items: { type: object, properties: { name: { type: string }, sha: { type: string } } } }
                  tags: { type: array, items: { type: object, properties: { name: { type: string }, sha: { type: string } } } }
                  error: { type: string, nullable: true }
        '404':
          $ref: '#/components/responses/NotFound'
  /modules/{moduleId}/overview:
    get:
      operationId: getModuleOverview
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module overview read model }
  /modules/{moduleId}/pipeline-runs:
    post:
      operationId: startModulePipelineRun
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRunCreate' }
      responses:
        '202': { description: Pipeline accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listModulePipelineRuns
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module pipeline history }
  /modules/{moduleId}/versions:
    get:
      operationId: listModuleVersions
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module release versions and evidence }
    post:
      operationId: createModuleVersion
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCreate' }
      responses:
        '201': { description: Module version registered }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/versions/{tag}/ci-report:
    post:
      operationId: publishModuleCiReport
      description: Authenticated pipeline callback for version quality and security evidence.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: tag
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCiReport' }
      responses:
        '202': { description: CI report accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/config-revisions:
    get:
      operationId: listModuleConfigRevisions
      summary: List configuration revisions for a module
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Configuration revision history }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: proposeModuleConfigRevision
      summary: Propose a new immutable configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigRevisionCreate' }
      responses:
        '201': { description: Configuration revision created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/config-revisions/diff:
    get:
      operationId: diffModuleConfigRevisions
      summary: Diff two configuration revisions
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: fromRev
          in: query
          required: true
          schema: { type: integer }
        - name: toRev
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Structural diff between revisions }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{moduleId}/config-revisions/{revisionId}/approve:
    post:
      operationId: approveModuleConfigRevision
      summary: Approve a pending production configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200': { description: Configuration revision approved and activated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/config-revisions/{revisionId}/reject:
    post:
      operationId: rejectModuleConfigRevision
      summary: Reject a pending configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/RevisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigRevisionReject' }
      responses:
        '200': { description: Configuration revision rejected }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/config-revisions/{revisionNumber}/rollback:
    post:
      operationId: rollbackModuleConfigRevision
      summary: Rollback to a past configuration revision
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/RevisionNumber'
      responses:
        '200': { description: New configuration revision created copying the target revision }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modules/{moduleId}/drift:
    get:
      operationId: detectModuleDrift
      summary: Detect configuration and DCIM drift for a module
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Configuration and DCIM drift report }
        '404': { $ref: '#/components/responses/NotFound' }
  /servers/health:
    get:
      operationId: listServersHealth
      summary: Query server health records from DCIM collector
      parameters:
        - name: serverName
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Server health records }
  /modules/{moduleId}/dora:
    get:
      operationId: getModuleDora
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Four DORA metrics for module }
  /production-requests:
    get:
      operationId: listProductionRequests
      responses:
        '200': { description: Production approval queue }
    post:
      operationId: createProductionRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionRequestCreate' }
      responses:
        '201': { description: Scheduled production request created in waiting-approval state }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /production-requests/{requestId}/approve:
    post:
      operationId: approveProductionRequest
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '202': { description: Approval accepted }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-requests/{requestId}/reject:
    post:
      operationId: rejectProductionRequest
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '202': { description: Rejection accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /production-requests/{requestId}/plan:
    get:
      operationId: get_production_request_plan
      summary: Get release plan DAG and wave execution progress
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
      responses:
        '200':
          description: Production request release plan
        '404':
          $ref: '#/components/responses/NotFound'
  /production-requests/{requestId}/canary/advance:
    post:
      operationId: advance_canary_step
      summary: Advance canary traffic step or verify metrics
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                metrics:
                  type: object
                  additionalProperties:
                    type: number
                canaryRules:
                  type: object
                  description: Header/cookie steering rules (headerName, headerValue, cookie) applied to the canary ingress
                  additionalProperties: true
      responses:
        '200':
          description: >-
            Canary traffic step advanced. `status` is `advanced`, `promoting` (the last step:
            the canary takes 100 % and a `promote` deployment moves the stable release to the
            same digest and retires the canary release), `completed`, or `aborted` when the
            metrics breached the thresholds (then `canaryReleaseRetired` says whether a healthy
            canary release was rolled back).
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  status: { type: string, enum: [advanced, promoting, completed, aborted] }
                  trafficWeight: { type: integer, minimum: 0, maximum: 100 }
                  canaryStep: { type: integer }
                  reason: { type: string }
                  promotionDeploymentId: { type: string, format: uuid }
                  canaryReleaseRetired: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: No traffic router is configured (NETCI_TRAFFIC_ROUTER); the weight is refused, not recorded
  /production-requests/{requestId}/canary/abort:
    post:
      operationId: abort_canary_step
      summary: Abort canary traffic and revert to baseline
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Canary aborted; weight 0 on the router and, for a healthy canary, its release rolled back
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [aborted] }
                  trafficWeight: { type: integer }
                  reason: { type: string }
                  canaryReleaseRetired: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: No traffic router is configured (NETCI_TRAFFIC_ROUTER)
  /servers:
    get:
      operationId: listServers
      responses:
        '200': { description: Read-only projection of runtime targets already referenced by module configuration; unknown health is not promoted to online }
  /audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: systemId, in: query, required: false, schema: { type: string } }
        - { name: moduleId, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Audit events }
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: How a browser signs in
      description: >-
        Unauthenticated by necessity: the login page reads it first. `authMode` is the
        server's; for `oidc`, `oidc` carries the public (PKCE) client id and the provider's
        endpoints from its discovery document, or `error: discovery_unavailable`. Null when
        no browser client is configured (NETCI_OIDC_BROWSER_CLIENT_ID): paste-a-token only.
      responses:
        '200':
          description: Sign-in configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  authMode: { type: string }
                  oidc:
                    type: object
                    nullable: true
                    properties:
                      issuer: { type: string }
                      clientId: { type: string }
                      authorizationEndpoint: { type: string }
                      tokenEndpoint: { type: string }
                      endSessionEndpoint: { type: string }
                      scopes: { type: array, items: { type: string } }
                      pkce: { type: string, enum: [S256] }
                      error: { type: string }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user identity and authentication status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /applications:
    post:
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listApplications
      responses:
