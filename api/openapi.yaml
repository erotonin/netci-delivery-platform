openapi: 3.0.3
info:
  title: netCI Delivery API
  version: 0.1.0
  description: API-first contract for netCI Delivery Platform.
servers:
  - url: http://localhost:8000

paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy and every configured dependency is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A configured dependency is unreachable; writes would fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /stage-catalog:
    get:
      operationId: listStageCatalog
      responses:
        '200':
          description: Available stages and templates
          content:
            application/json:
              schema:
                type: object
                required: [stages, templates]
                properties:
                  stages:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageDefinition'
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateDefinition'
  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /dcim/services:
    get:
      operationId: searchDcimServices
      description: Search the fixture-backed DCIM service catalog used by the local reference implementation.
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, default: '' }
      responses:
        '200': { description: Matching DCIM services and source metadata }
  /dcim/modules:
    get:
      operationId: listDcimModules
      description: List fixture-backed DCIM modules for a system.
      parameters:
        - name: systemId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: DCIM modules and source metadata }
        '404': { $ref: '#/components/responses/NotFound' }
  /systems:
    get:
      operationId: listSystems
      responses:
        '200':
          description: Release Portal systems
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
    post:
      operationId: createSystem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id, unit, description], additionalProperties: false }
      responses:
        '201': { description: System created }
        '409': { $ref: '#/components/responses/Conflict' }
  /systems/{systemId}:
    get:
      operationId: getSystem
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: System detail }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSystem
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '204': { description: System removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /systems/{systemId}/modules:
    get:
      operationId: listSystemModules
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: Modules in system }
    post:
      operationId: createModule
      parameters:
        - $ref: '#/components/parameters/SystemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleCreate' }
      responses:
        '201': { description: Module created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /systems/{systemId}/dora:
    get:
      operationId: getSystemDora
      parameters:
        - $ref: '#/components/parameters/SystemId'
      responses:
        '200': { description: Four DORA metrics for system }
  /modules/{moduleId}:
    get:
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module detail }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '204': { description: Module removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{moduleId}/overview:
    get:
      operationId: getModuleOverview
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module overview read model }
  /modules/{moduleId}/pipeline-runs:
    post:
      operationId: startModulePipelineRun
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRunCreate' }
      responses:
        '202': { description: Pipeline accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listModulePipelineRuns
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module pipeline history }
  /modules/{moduleId}/versions:
    get:
      operationId: listModuleVersions
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Module release versions and evidence }
    post:
      operationId: createModuleVersion
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCreate' }
      responses:
        '201': { description: Module version registered }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/versions/{tag}/ci-report:
    post:
      operationId: publishModuleCiReport
      description: Authenticated pipeline callback for version quality and security evidence.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: tag
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCiReport' }
      responses:
        '202': { description: CI report accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules/{moduleId}/dora:
    get:
      operationId: getModuleDora
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200': { description: Four DORA metrics for module }
  /production-requests:
    get:
      operationId: listProductionRequests
      responses:
        '200': { description: Production approval queue }
    post:
      operationId: createProductionRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionRequestCreate' }
      responses:
        '201': { description: Scheduled production request created in waiting-approval state }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /production-requests/{requestId}/approve:
    post:
      operationId: approveProductionRequest
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '202': { description: Approval accepted }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-requests/{requestId}/reject:
    post:
      operationId: rejectProductionRequest
      parameters:
        - $ref: '#/components/parameters/ProductionRequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '202': { description: Rejection accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /servers:
    get:
      operationId: listServers
      responses:
        '200': { description: Jenkins controllers and runtime targets }
  /audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: systemId, in: query, required: false, schema: { type: string } }
        - { name: moduleId, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Audit events }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user identity and authentication status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /applications:
    post:
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listApplications
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
  /applications/{applicationId}/dora:
    get:
      operationId: getApplicationDora
      description: >-
        Four DORA metrics projected from durable delivery events. sourceEvents states
        how many events the figures came from, so a dashboard number is always traceable.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: DORA dashboard payload matching api/dora-dashboard.schema.json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoraDashboard'
        '404':
          $ref: '#/components/responses/NotFound'
  /delivery-events:
    get:
      operationId: listDeliveryEvents
      description: Source events behind the DORA projection, for acceptance evidence.
      parameters:
        - name: applicationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery source events
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryEvent'
  /applications/{applicationId}/pipeline-runs:
    post:
      operationId: startPipelineRun
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunCreate'
      responses:
        '202':
          description: Pipeline accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}:
    get:
      operationId: getPipelineRun
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pipeline run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/logs:
    get:
      operationId: getPipelineLogs
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pipeline logs
          content:
            application/json:
              schema:
                type: object
                required: [pipelineRunId, correlationId, lines]
                properties:
                  pipelineRunId: { type: string, format: uuid }
                  correlationId: { type: string }
                  lines: { type: array, items: { type: string } }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/ci-result:
    post:
      operationId: recordCiResult
      description: Local callback seam for CI status and immutable artifact metadata; it performs no Jenkins or runtime I/O.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiResultRequest'
      responses:
        '202':
          description: CI result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}:
    get:
      operationId: getDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Deployment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /pipeline-runs/{pipelineRunId}/security-evidence:
    post:
      operationId: publishSecurityEvidence
      description: >-
        CI publishes SBOM, vulnerability-scan and signature evidence for one immutable
        artifact. netCI returns the supply-chain policy verdict and re-applies the same
        rules before any deployment is created.
      security:
        - pipelineApiKey: []
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityEvidence'
      responses:
        '202':
          description: Evidence recorded with a policy decision
          content:
            application/json:
              schema:
                type: object
                required: [pipelineRunId, decision, reason]
                properties:
                  pipelineRunId: { type: string, format: uuid }
                  decision: { type: string, enum: [allow, deny] }
                  reason: { type: string }
                  checks: { type: object, additionalProperties: { type: string } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: getSecurityEvidence
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
      responses:
        '200':
          description: Stored supply-chain evidence and its policy decision
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/NotFound'
  /deployments/{deploymentId}/approve:
    post:
      operationId: approveDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '202':
          description: Approval accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}/result:
    post:
      operationId: recordDeploymentResult
      description: Local callback seam for a runtime adapter result; it performs no deployment itself.
      security:
        - PipelineBearer: []
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentResultRequest'
      responses:
        '202':
          description: Deployment result accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /deployments/{deploymentId}/rollback:
    post:
      operationId: rollbackDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '202':
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    PipelineBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    SystemId:
      name: systemId
      in: path
      required: true
      schema: { type: string }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    ProductionRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineRunId:
      name: pipelineRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Unauthorized:
      description: Missing or invalid machine callback credential
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency or domain conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request validation or domain validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ModuleCreate:
      type: object
      required: [name, repositoryUrl, pipelineTemplate, runtime, deploymentEnvironments]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        displayName: { type: string, minLength: 1, maxLength: 255 }
        repositoryUrl: { type: string, format: uri }
        pipelineTemplate: { type: string, enum: [container-ci-cd-v1, kubernetes-ci-cd-v1, systemd-ansible-ci-cd-v1] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        moduleType: { type: string, default: Backend }
        description: { type: string }
        defaultEnvironment: { $ref: '#/components/schemas/Environment', default: dev }
        stages: { type: array, items: { type: string } }
        pipelineConfig: { $ref: '#/components/schemas/ModulePipelineConfig' }
        deploymentEnvironments:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/DeploymentEnvironmentConfig' }
    DeploymentEnvironmentConfig:
      type: object
      additionalProperties: false
      required: [displayName, environment, runtime, servers, tasks]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        environment: { $ref: '#/components/schemas/Environment' }
        runtime: { $ref: '#/components/schemas/Runtime' }
        servers:
          type: array
          maxItems: 200
          items: { type: string }
        tasks:
          type: array
          maxItems: 100
          items: { type: string }
        taskSettings: { $ref: '#/components/schemas/ModuleTaskSettings' }
        kubeconfigRef: { type: string, minLength: 1, maxLength: 255, nullable: true }
        namespace: { type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63, nullable: true }
    ModuleTaskSettings:
      type: object
      additionalProperties: false
      properties:
        healthCheck:
          allOf:
            - $ref: '#/components/schemas/HealthCheckSettings'
          nullable: true
    HealthCheckSettings:
      type: object
      additionalProperties: false
      required: [script]
      properties:
        script: { type: string, minLength: 1, maxLength: 4000 }
        retries: { type: integer, minimum: 1, maximum: 20, default: 3 }
        delay: { type: string, pattern: '^\d+(ms|s|m)$', default: 10s }
    ModulePipelineTabConfig:
      type: object
      additionalProperties: false
      required: [branch, coverageReportPath, stages]
      properties:
        branch: { type: string, minLength: 1, maxLength: 500 }
        coverageReportPath: { type: string, minLength: 1, maxLength: 500 }
        stages:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
    ModulePipelineConfig:
      type: object
      additionalProperties: false
      required: [runner, strategy, pipelines]
      properties:
        runner: { type: string, minLength: 1, maxLength: 255 }
        strategy: { type: string, enum: [Gitflow, Trunk-based, Custom Pipeline] }
        pipelines:
          type: object
          minProperties: 1
          maxProperties: 10
          additionalProperties: { $ref: '#/components/schemas/ModulePipelineTabConfig' }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        engines:
          type: object
          description: Which CI/CD engines this instance is wired to.
          properties:
            ci: { type: string, enum: [none, jenkins] }
            cd: { type: string, enum: [none, temporal] }
        dependencies:
          type: object
          additionalProperties: true
    SecurityEvidence:
      type: object
      required: [artifactDigest, sbom, vulnerabilityScan, signature]
      properties:
        artifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        artifactRef: { type: string, nullable: true }
        buildRunId: { type: string, nullable: true }
        sbom:
          type: object
          required: [generatedBy, location]
          properties:
            generatedBy: { type: string, enum: [syft] }
            location: { type: string }
            format: { type: string, default: cyclonedx-json }
        vulnerabilityScan:
          type: object
          required: [scanner, status]
          properties:
            scanner: { type: string, enum: [trivy] }
            status: { type: string, enum: [passed, failed] }
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
            reportLocation: { type: string, nullable: true }
        signature:
          type: object
          required: [provider, verified]
          properties:
            provider: { type: string, enum: [cosign] }
            verified: { type: boolean }
            certificateIdentity: { type: string, nullable: true }
            bundleLocation: { type: string, nullable: true }
    DeliveryEvent:
      type: object
      required: [id, eventType, applicationId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [commit, deployment, recovery] }
        applicationId: { type: string, format: uuid }
        pipelineRunId: { type: string, format: uuid, nullable: true }
        deploymentId: { type: string, format: uuid, nullable: true }
        commitSha: { type: string, nullable: true }
        environment: { $ref: '#/components/schemas/Environment' }
        successful: { type: boolean, nullable: true }
        requiresIntervention: { type: boolean }
        occurredAt: { type: string, format: date-time }
    DoraDashboard:
      type: object
      required: [applicationId, period, metrics, sourceEvents]
      properties:
        applicationId: { type: string, format: uuid }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        metrics:
          type: object
          required: [deploymentFrequency, changeLeadTimeSecondsAvg, changeFailRate, timeToRestoreServiceSecondsAvg]
          properties:
            deploymentFrequency: { type: number, minimum: 0 }
            changeLeadTimeSecondsAvg: { type: number, minimum: 0 }
            changeFailRate: { type: number, minimum: 0, maximum: 1 }
            timeToRestoreServiceSecondsAvg: { type: number, minimum: 0 }
        sourceEvents: { type: integer, minimum: 0 }
    Runtime:
      type: string
      enum: [docker, kubernetes, systemd]
    Environment:
      type: string
      enum: [dev, staging, prod]
    ApplicationCreate:
      type: object
      required: [name, repositoryUrl, pipelineTemplate, runtime]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        repositoryUrl: { type: string, format: uri }
        pipelineTemplate: { type: string, enum: [container-ci-cd-v1, kubernetes-ci-cd-v1, systemd-ansible-ci-cd-v1] }
        runtime: { $ref: '#/components/schemas/Runtime' }
        defaultEnvironment: { $ref: '#/components/schemas/Environment', default: dev }
        stages:
          type: array
          items: { type: string }
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationCreate'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    StageDefinition:
      type: object
      required: [id, name, category, enabledByDefault]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [source, test, build, security, publish, deploy, verify] }
        enabledByDefault: { type: boolean }
        parameters: { type: object, additionalProperties: true }
    TemplateDefinition:
      type: object
      required: [id, name, runtime, stageIds]
      properties:
        id: { type: string }
        name: { type: string }
        runtime: { $ref: '#/components/schemas/Runtime' }
        stageIds: { type: array, items: { type: string } }
    PipelineRunCreate:
      type: object
      required: [commitSha, environment]
      properties:
        commitSha: { type: string, minLength: 7 }
        branch: { type: string, default: main }
        environment: { $ref: '#/components/schemas/Environment' }
        parameters: { type: object, additionalProperties: true }
    PipelineRun:
      type: object
      required: [id, applicationId, status, commitSha, createdAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, waiting_approval, succeeded, failed, cancelled, rolled_back] }
        commitSha: { type: string }
        branch: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        parameters: { type: object, additionalProperties: true }
        jenkinsRunId: { type: string, nullable: true }
        workflowId: { type: string, nullable: true }
        artifactDigest: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CiResultRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [running, succeeded, failed] }
        artifactDigest: { type: string, nullable: true, pattern: '^sha256:[0-9a-f]{64}$' }
        logLines:
          type: array
          maxItems: 1000
          items: { type: string }
    CiResultResponse:
      type: object
      required: [pipelineRun, deployment]
      additionalProperties: false
      properties:
        pipelineRun: { $ref: '#/components/schemas/PipelineRun' }
        deployment:
          allOf:
            - $ref: '#/components/schemas/Deployment'
          nullable: true
    Deployment:
      type: object
      required: [id, applicationId, runtime, environment, status]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        runtime: { $ref: '#/components/schemas/Runtime' }
        environment: { $ref: '#/components/schemas/Environment' }
        status: { type: string, enum: [pending_approval, deploying, healthy, failed, rolled_back] }
        artifactDigest: { type: string }
        approvedBy: { type: string, nullable: true }
    DeploymentResultRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [healthy, failed] }
        message: { type: string, nullable: true, maxLength: 2000 }
    VersionCiReport:
      type: object
      required: [coverage, autoTest, sast, sastIssues, vulnerabilities, commit]
      additionalProperties: false
      properties:
        coverage: { type: number, minimum: 0, maximum: 100 }
        autoTest: { type: string, enum: [passed, failed, skipped] }
        sast: { type: string, enum: [passed, failed] }
        sastIssues: { type: integer, minimum: 0 }
        vulnerabilities:
          type: object
          required: [critical, high, medium]
          additionalProperties: false
          properties:
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
        commit: { type: string, pattern: '^[0-9a-fA-F]{7,64}$' }
    VersionCreate:
      type: object
      required: [tag, gitTagUrl, artifactUrl]
      additionalProperties: false
      properties:
        tag: { type: string, pattern: '^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$' }
        gitTagUrl: { type: string, format: uri }
        artifactUrl: { type: string, format: uri }
        createdBy: { type: string, minLength: 2, maxLength: 120, default: Admin }
    ProductionRequestCreate:
      type: object
      required: [modules, scheduledFor]
      additionalProperties: false
      properties:
        modules:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ProductionRequestModuleCreate' }
        requestedBy: { type: string, minLength: 2, maxLength: 120, default: Admin }
        scheduledFor: { type: string, format: date-time }
        rollbackStrategy: { type: string, enum: [automatic, manual], default: automatic }
        runAutomationTests: { type: boolean, default: true }
    ProductionRequestModuleCreate:
      type: object
      required: [moduleId, version, deploymentOrder]
      additionalProperties: false
      properties:
        moduleId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
        version: { type: string, pattern: '^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$' }
        deploymentOrder: { type: integer, minimum: 1, maximum: 100 }
    ApprovalRequest:
      type: object
      properties:
        actor: { type: string, default: local-reviewer }
        comment: { type: string, maxLength: 1000 }
    RollbackRequest:
      type: object
      required: [targetArtifactDigest, reason]
      properties:
        targetArtifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        reason: { type: string, minLength: 3 }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, nullable: true }
