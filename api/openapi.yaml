  /pipeline-runs/{pipelineRunId}/callback-token:
    post:
      operationId: issuePipelineCallbackToken
      summary: Mint a scoped, short-lived callback token for one pipeline run
      description: >-
        Machine callbacks authenticate with a token bound to a single workload
        (`jenkins`/`temporal`), a single application, a single run or deployment, and an
        explicit set of scopes. A token for run A cannot write to run B, a Jenkins token
        cannot report a deployment result, and a token carrying a terminal scope is
        single-use.


        Normally the CI launcher mints this in-process when it dispatches a build; this
        endpoint exists so an operator can re-issue one whose lifetime expired. It is
        platform-admin only, because whoever can mint a token for a run can report that
        run's result. The token is returned once and never stored -- netCI keeps only its
        `jti`, which is what makes replay detectable.
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallbackTokenRequest' }
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackTokenResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /pipeline-runs/{pipelineRunId}:
    get:
      operationId: getPipelineRun
      parameters:
        - $ref: '#/components/parameters/PipelineRunId'
