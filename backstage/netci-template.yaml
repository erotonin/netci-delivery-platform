apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: netci-application
  title: Create netCI Application
  description: Create a delivery application through the netCI API.
spec:
  owner: platform-engineering
  type: service
  parameters:
    - title: Application details
      required: [name, repositoryUrl, pipelineTemplate, runtime]
      properties:
        name:
          title: Application name
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,62}$'
        repositoryUrl:
          title: Repository URL
          type: string
          format: uri
        pipelineTemplate:
          title: Pipeline template
          type: string
          enum:
            - container-ci-cd-v1
            - kubernetes-ci-cd-v1
            - systemd-ansible-ci-cd-v1
          enumNames:
            - Container CI/CD v1
            - Kubernetes CI/CD v1
            - Systemd Ansible CI/CD v1
        runtime:
          title: Runtime
          description: Must match the selected template; netCI validates this invariant.
          type: string
          enum: [docker, kubernetes, systemd]
        defaultEnvironment:
          title: Default environment
          type: string
          enum: [dev, staging, prod]
          default: dev
  steps:
    - id: createNetciApplication
      name: Create application in netCI
      # Requires @roadiehq/scaffolder-backend-module-http-request in the Backstage
      # backend; http:backstage:request is not a built-in action.
      #
      # The path is relative to Backstage's /api root: the action prefixes /api itself,
      # so writing /api/proxy/... here produces /api/api/proxy/... and a 404.
      action: http:backstage:request
      input:
        method: POST
        path: /proxy/netci/applications
        headers:
          content-type: application/json
        body:
          name: ${{ parameters.name }}
          repositoryUrl: ${{ parameters.repositoryUrl }}
          pipelineTemplate: ${{ parameters.pipelineTemplate }}
          runtime: ${{ parameters.runtime }}
          defaultEnvironment: ${{ parameters.defaultEnvironment }}
  output:
    links:
      - title: Open netCI Portal
        url: http://localhost:5173
    text:
      - title: Created netCI application
        content: |
          Application `${{ parameters.name }}` was created with ID
          `${{ steps.createNetciApplication.output.body.id }}`.
