# Lab inventory that deploys to the machine running the gate itself.
#
# Use this when there is no separate KVM guest available (or when the Docker daemon
# has no bridge network, so published ports do not work). local.ini remains the
# inventory for the documented two-VM topology.
#
# Host names here are the DCIM device names (scripts/netbox_seed_lab_inventory.py).
# netCI validates the target against DCIM and then passes the same name to
# `ansible-playbook --limit`; an inventory that knows the machine under a different
# name would silently deploy to nothing. One physical host, six logical targets.
[docker_targets]
netci-local-docker-dev      ansible_connection=local
netci-local-docker-staging  ansible_connection=local
netci-local-docker-prod     ansible_connection=local

[systemd_targets]
netci-local-systemd-dev     ansible_connection=local
netci-local-systemd-staging ansible_connection=local
netci-local-systemd-prod    ansible_connection=local

[all:vars]
ansible_python_interpreter=/usr/bin/python3
netci_become=false
