# Lab inventory that deploys to the machine running the gate itself.
#
# Use this when there is no separate KVM guest available (or when the Docker daemon
# has no bridge network, so published ports do not work). local.ini remains the
# inventory for the documented two-VM topology.
#
# Host names here are the DCIM device names (scripts/netbox_seed_lab_inventory.py).
# netCI validates the target against DCIM and then passes the same name to
# `ansible-playbook --limit`; an inventory that knows the machine under a different
# name would silently deploy to nothing. One physical host, six logical targets.
[docker_targets]
netci-local-docker-dev      ansible_connection=local
netci-local-docker-staging  ansible_connection=local
netci-local-docker-prod     ansible_connection=local
# The same separate host as below also runs a Docker daemon: the docker runtime's
# production target, reached over SSH like the systemd one. A different inventory name
# because NetBox records it as a second device (one tenant/role per device).
netci-prod-02               ansible_host=172.17.0.60 ansible_user=netci netci_become=true
# The second lab system (tenant audit-shop, role shop-api in NetBox): the same machine
# again under the names its DCIM records carry.
audit-shop-docker-dev       ansible_connection=local
audit-shop-docker-staging   ansible_connection=local
audit-shop-docker-prod      ansible_connection=local
banking-core-docker-dev     ansible_connection=local
banking-core-docker-staging ansible_connection=local
banking-core-docker-prod    ansible_connection=local


[systemd_targets]
netci-local-systemd-dev     ansible_connection=local
netci-local-systemd-staging ansible_connection=local
netci-local-systemd-prod    ansible_connection=local
# A separate production host (scripts/lab/prod_host.sh), reached over SSH with the key
# and known_hosts the worker is configured with (NETCI_ANSIBLE_*); the playbook
# escalates with `become` and installs a system-scope unit there.
netci-prod-01               ansible_host=172.17.0.60 ansible_user=netci netci_become=true

[all:vars]
ansible_python_interpreter=/usr/bin/python3
netci_become=false
