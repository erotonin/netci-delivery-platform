---
- name: Deploy sample container service to Docker VM
  hosts: docker_targets
  become: "{{ netci_become | default(true) }}"
  vars:
    netci_app_name: "{{ app_name | default('hello-container') }}"
    netci_app_root: "{{ app_root | default('/opt/netci-docker-demo') }}"
    netci_registry_url: "{{ registry_url | default('192.168.122.1:5000') }}"
    netci_image_repository: "{{ image_repository | default(netci_registry_url ~ '/hello-container') }}"
    netci_artifact_digest: "{{ artifact_digest | default('') }}"
    netci_host_port: "{{ host_port | default(18081) }}"
    # On a host-networked lab the container binds this port directly, so the health
    # check and the published port are the same number.
    netci_network_mode: "{{ network_mode | default('bridge') }}"
    netci_container_port: >-
      {{ container_port | default(netci_host_port if netci_network_mode == 'host' else 8080) }}
    netci_health_port: "{{ netci_container_port if netci_network_mode == 'host' else netci_host_port }}"

  pre_tasks:
    - name: Require immutable artifact digest
      ansible.builtin.assert:
        that:
          - netci_artifact_digest is match('^sha256:[0-9a-f]{64}$')
          - netci_artifact_digest != 'sha256:' ~ ('0' * 64)
          - netci_image_repository is not search('@')
          - netci_image_repository is not search(':[Ll][Aa][Tt][Ee][Ss][Tt]$')
        fail_msg: >-
          artifact_digest must be a verified non-zero sha256 digest and
          image_repository must not contain a mutable tag

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ netci_app_root }}"
        state: directory
        mode: "0755"

    - name: Deploy and verify requested image
      block:
        - name: Render Compose file
          ansible.builtin.template:
            src: hello-container.compose.yml.j2
            dest: "{{ netci_app_root }}/compose.yml"
            mode: "0644"
            backup: true
          register: compose_template

        - name: Pull and start service
          community.docker.docker_compose_v2:
            project_src: "{{ netci_app_root }}"
            state: present
            pull: always

        - name: Wait for health endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ netci_health_port }}/healthz"
            status_code: 200
            return_content: true
          register: docker_health
          retries: 12
          delay: 2
          until:
            - docker_health.status == 200
            - (docker_health.json.status | default('')) == 'ok'

      rescue:
        - name: Restore previous Compose definition when available
          ansible.builtin.copy:
            src: "{{ compose_template.backup_file }}"
            dest: "{{ netci_app_root }}/compose.yml"
            remote_src: true
            mode: "0644"
          when: compose_template.backup_file is defined

        - name: Restart previous Compose deployment
          community.docker.docker_compose_v2:
            project_src: "{{ netci_app_root }}"
            state: present
            pull: never
          when: compose_template.backup_file is defined

        - name: Stop failed first deployment
          community.docker.docker_compose_v2:
            project_src: "{{ netci_app_root }}"
            state: absent
          when: compose_template.backup_file is not defined

        - name: Fail after Docker rollback
          ansible.builtin.fail:
            msg: "new Docker release failed its health check and rollback was attempted"
