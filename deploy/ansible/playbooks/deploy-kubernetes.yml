---
- name: Deploy sample application to Kubernetes through Helm
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netci_kubeconfig: "{{ kubeconfig | default(lookup('env', 'KUBECONFIG'), true) }}"
    netci_kube_context: "{{ kube_context | default('kind-netci-local') }}"
    netci_release_name: "{{ release_name | default('hello-kubernetes') }}"
    netci_target_namespace: "{{ target_namespace | default('staging') }}"
    netci_chart_path: "{{ chart_path | default(playbook_dir ~ '/../../helm/sample-kubernetes-app') }}"
    # The registry may be reachable from the cluster under a different name than the one
    # CI pushed to; the digest below is unchanged, and the kubelet verifies it on pull.
    netci_image_repository: >-
      {{ (image_repository | default('localhost:5000/hello-kubernetes'))
         | regex_replace('^[^/]+/', image_pull_host ~ '/') if (image_pull_host | default('')) else
         (image_repository | default('localhost:5000/hello-kubernetes')) }}
    netci_artifact_digest: "{{ artifact_digest | default('') }}"
    # Progressive delivery (ADR-031). `stable` is the ordinary release. `canary` installs
    # the digest as a second release, `<release>-canary`, behind an ingress-nginx canary
    # ingress carrying `canary_weight`; stable is untouched. `promote` moves stable to the
    # digest and removes the canary release. A rollback of a canary removes the canary
    # release; stable never changed.
    netci_release_track: "{{ release_track | default('stable') }}"
    netci_canary_weight: "{{ canary_weight | default(0) }}"
    netci_canary_release: "{{ netci_release_name }}-canary"
    netci_helm_release: "{{ netci_canary_release if netci_release_track == 'canary' else netci_release_name }}"
    netci_workload_name: "{{ netci_helm_release }}-sample-kubernetes-app"
    netci_remove_canary: "{{ netci_release_track == 'promote' or (netci_release_track == 'canary' and netci_action | default('deploy') == 'rollback') }}"
    # One expression that yields a dict: a value templated field by field arrives at
    # Helm as strings ("got string, want integer" against the chart's schema).
    netci_release_values: >-
      {{ {
        'environment': netci_target_namespace,
        'image': {'repository': netci_image_repository, 'digest': netci_artifact_digest},
        'netci': {'releaseName': netci_release_name, 'applicationId': application_id | default('')},
        'canary': {
          'enabled': netci_release_track == 'canary',
          'weight': (netci_canary_weight | int) if netci_release_track == 'canary' else 0,
        },
      } }}

  pre_tasks:
    - name: Validate immutable Kubernetes release input
      ansible.builtin.assert:
        that:
          - netci_artifact_digest is match('^sha256:[0-9a-f]{64}$')
          - netci_artifact_digest != 'sha256:' ~ ('0' * 64)
          - netci_image_repository is not search('@')
          - netci_image_repository is not search(':[Ll][Aa][Tt][Ee][Ss][Tt]$')
          - netci_target_namespace in ['dev', 'staging', 'prod']
          - netci_release_track in ['stable', 'canary', 'promote']
          - netci_canary_weight | int >= 0 and netci_canary_weight | int <= 100
        fail_msg: >-
          Kubernetes deployment requires a verified non-zero sha256 digest,
          an untagged repository, a managed target namespace and a known release track

  tasks:
    - name: Deploy Helm release atomically
      when: not (netci_release_track == 'canary' and netci_action | default('deploy') == 'rollback')
      kubernetes.core.helm:
        name: "{{ netci_helm_release }}"
        chart_ref: "{{ netci_chart_path }}"
        release_namespace: "{{ netci_target_namespace }}"
        create_namespace: false
        kubeconfig: "{{ netci_kubeconfig if netci_kubeconfig | length > 0 else omit }}"
        kube_context: "{{ netci_kube_context }}"
        release_values: "{{ netci_release_values }}"
        wait: true
        wait_timeout: 180s
        atomic: true
        history_max: 10
        validate_certs: true

    - name: Read deployed workload after Helm health checks
      when: not (netci_release_track == 'canary' and netci_action | default('deploy') == 'rollback')
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ netci_workload_name }}"
        namespace: "{{ netci_target_namespace }}"
        kubeconfig: "{{ netci_kubeconfig if netci_kubeconfig | length > 0 else omit }}"
        context: "{{ netci_kube_context }}"
      register: deployed_workload

    - name: Verify the requested digest is running
      when: not (netci_release_track == 'canary' and netci_action | default('deploy') == 'rollback')
      ansible.builtin.assert:
        that:
          - deployed_workload.resources | length == 1
          - deployed_workload.resources[0].status.availableReplicas | default(0) | int >= 1
          - deployed_workload.resources[0].spec.template.spec.containers[0].image == netci_image_repository ~ '@' ~ netci_artifact_digest
        fail_msg: "Helm completed but the requested immutable artifact is not available"

    - name: Read the canary ingress the router will steer
      when: netci_release_track == 'canary' and netci_action | default('deploy') != 'rollback'
      kubernetes.core.k8s_info:
        api_version: networking.k8s.io/v1
        kind: Ingress
        name: "{{ netci_workload_name }}-ingress"
        namespace: "{{ netci_target_namespace }}"
        kubeconfig: "{{ netci_kubeconfig if netci_kubeconfig | length > 0 else omit }}"
        context: "{{ netci_kube_context }}"
      register: canary_ingress

    - name: Verify the canary ingress carries the requested weight
      when: netci_release_track == 'canary' and netci_action | default('deploy') != 'rollback'
      ansible.builtin.assert:
        that:
          - canary_ingress.resources | length == 1
          - canary_ingress.resources[0].metadata.annotations['nginx.ingress.kubernetes.io/canary'] | default('') == 'true'
          - canary_ingress.resources[0].metadata.annotations['nginx.ingress.kubernetes.io/canary-weight'] | default('') == netci_canary_weight | string
        fail_msg: "the canary release is up but its ingress is not an ingress-nginx canary at the requested weight"

    - name: Remove the canary release
      when: netci_remove_canary | bool
      kubernetes.core.helm:
        name: "{{ netci_canary_release }}"
        release_namespace: "{{ netci_target_namespace }}"
        state: absent
        wait: true
        kubeconfig: "{{ netci_kubeconfig if netci_kubeconfig | length > 0 else omit }}"
        kube_context: "{{ netci_kube_context }}"
