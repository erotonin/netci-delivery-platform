{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.netci.digest | default "")) -}}
{{- fail "netci.digest is required and must be sha256: followed by 64 hex digits (images are pinned by digest)" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-lease
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [jenkins]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-lease
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: cell-lease
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: {{ .Release.Namespace }}
  labels:
    netci.io/cell: "true"
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
        netci.io/cell: "true"
    spec:
      serviceAccountName: jenkins
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Cells on different machines where possible: one machine lost takes as few controllers as
      # possible. Preferred, not required: a takeover onto the last machine with room must not be
      # refused for it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    netci.io/cell: "true"
                namespaceSelector: {}
                topologyKey: kubernetes.io/hostname
      # The Cell Supervisor deletes this pod itself, the netci chart's supervisor.storageSettle after
      # it fences the machine: deleting it starts the volume's detach, and one asked for while the
      # storage is still taking in that the node is gone waited ~10 s for the dead machine (lab).
      # Without the toleration Kubernetes' taint eviction deletes the pod the moment the
      # out-of-service taint is added, and the pod garbage collector force-deletes it on its next
      # pass: in the lab it came first for 3 of 8 pods, and two of their volumes were late. Past
      # the toleration Kubernetes deletes the pod anyway, so without a supervisor a takeover is
      # slower, never stuck.
      {{- if not (kindIs "float64" .Values.outOfServiceTolerationSeconds) }}
      {{- fail "outOfServiceTolerationSeconds: a number of seconds" }}
      {{- end }}
      tolerations:
        - key: node.kubernetes.io/out-of-service
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ int .Values.outOfServiceTolerationSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      shareProcessNamespace: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: install-guard
          image: {{ .Values.netci.repository }}@{{ .Values.netci.digest }}
          command: [/cell-agent, install, /netci-bin]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: netci-bin
              mountPath: /netci-bin
        - name: cell-agent
          image: {{ .Values.netci.repository }}@{{ .Values.netci.digest }}
          command: [/cell-agent]
          restartPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NETCI_LEASE_NAME
              value: jenkins
            - name: NETCI_LEASE_DURATION
              value: {{ .Values.lease.duration | quote }}
            - name: NETCI_RENEW_DEADLINE
              value: {{ .Values.lease.renewDeadline | quote }}
            - name: NETCI_TERMINATION_GRACE
              value: {{ printf "%ds" (sub .Values.terminationGracePeriodSeconds 5) }}
            # A changed JCasC ConfigMap is applied in place, when the cell's Secret has a
            # casc-reload-token; without it, at the next restart.
            # A JENKINS_HOME that stops taking writes is reported, and the supervisor restarts the
            # pod so that the volume is mounted again.
            - name: NETCI_HOME_PROBE_DIR
              value: /var/jenkins_home/.netci
            - name: NETCI_CASC_FILE
              value: /var/jenkins_config/jenkins.yaml
            - name: NETCI_CASC_RELOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: casc-reload-token
                  optional: true
          ports:
            - name: agent-metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: gate
              mountPath: /run/netci
            - name: casc
              mountPath: /var/jenkins_config
              readOnly: true
            - name: home
              mountPath: /var/jenkins_home
      containers:
        - name: jenkins
          image: {{ required "image.controller: the netCI controller image (jenkins/Dockerfile.controller), which carries the netCI plugin" .Values.image.controller | quote }}
          command: [/netci-bin/cell-agent, guard, --, /usr/local/bin/jenkins.sh]
          env:
            - name: NETCI_GATE_FILE
              value: /run/netci/gate
            - name: NETCI_RENEW_DEADLINE
              value: {{ .Values.lease.renewDeadline | quote }}
            - name: NETCI_PLUGINS_FROM_IMAGE
              value: {{ .Values.pluginsFromImageOnly | quote }}
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_config/jenkins.yaml
            - name: CASC_RELOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: casc-reload-token
                  optional: true
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            - name: JENKINS_OPTS
              value: {{ .Values.jenkinsOpts | quote }}
          ports:
            - containerPort: 8080
            - containerPort: 50000
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: casc
              mountPath: /var/jenkins_config
            - name: cache
              mountPath: /var/cache/jenkins
            - name: secrets
              mountPath: /run/secrets/cell
              readOnly: true
            - name: gate
              mountPath: /run/netci
              readOnly: true
            - name: netci-bin
              mountPath: /netci-bin
              readOnly: true
        {{- if .Values.logShipping.enabled }}
        # Every build log to Loki, read while the cell is taken over (templates/logship.yaml). A
        # regular container: it never holds Jenkins back from starting.
        - name: log-shipper
          {{- if not (contains "@sha256:" .Values.logShipping.image) }}
          {{- fail "logShipping.image: Fluent Bit pinned by digest (repository@sha256:...)" }}
          {{- end }}
          image: {{ .Values.logShipping.image }}
          args: ["-c", "/etc/netci-logship/fluent-bit.conf"]
          resources: {{- toYaml .Values.logShipping.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Read-write for its offsets only (.netci-logship.db).
            - name: home
              mountPath: /var/jenkins_home
            - name: logship
              mountPath: /etc/netci-logship
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.logShipping.enabled }}
        - name: logship
          configMap:
            name: netci-logship
        {{- end }}
        - name: gate
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: netci-bin
          emptyDir:
            sizeLimit: 128Mi
        - name: casc
          configMap:
            name: {{ required "casc.configMapName: the ConfigMap with the cell's jenkins.yaml" .Values.casc.configMapName }}
        - name: cache
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ required "secrets.secretName: the Secret mounted at /run/secrets/cell" .Values.secrets.secretName }}
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: agent
      port: 50000
      targetPort: 50000
{{- if .Values.kubernetesPlugin.enabled }}
---
# The Jenkins Kubernetes plugin's agents in this namespace, with the permissions its README asks
# for and no more (secrets read only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agents
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agents
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: jenkins-agents
  apiGroup: rbac.authorization.k8s.io
---
# The plugin's agents each run one build (label jenkins/label, which the plugin sets). Agents
# have the cluster's default priority, below a controller's: a controller that needs room after
# a takeover may preempt one, and in the lab one preempted the agent of the very build it was
# resuming. The scheduler avoids pods whose budget a preemption would break, so with this it
# takes idle pods first, and an agent only when nothing else frees room. Draining a node waits
# for its builds (kubectl drain --disable-eviction overrides).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jenkins-agents
  namespace: {{ .Release.Namespace }}
spec:
  # Sandboxes and agents are pods without a controller: Kubernetes defines a budget on such pods
  # only with an integer minAvailable ("maxUnavailable: 0" left the budget's status undefined, and
  # the disruption controller warned so). A minimum above any number of pods there can be allows
  # no voluntary disruption of any of them.
  minAvailable: 1000000
  selector:
    matchExpressions:
      - {key: jenkins/label, operator: Exists}
{{- end }}
{{- if .Values.ui.nodePort }}
---
# The controller's web UI on every node's port: for clusters without an ingress controller.
apiVersion: v1
kind: Service
metadata:
  name: jenkins-ui
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: {{ .Values.ui.nodePort }}
{{- end }}
{{- with .Values.ui.ingress }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: {{ $.Release.Namespace }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tlsSecretName }}
  tls:
    - hosts: [{{ required "ui.ingress.host is required with TLS" $.Values.ui.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ui.ingress.host is required" .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  name: http
{{- end }}
{{- end }}
