image:
  controller: ""

netci:
  repository: ""
  digest: ""

imagePullSecrets: []

storage:
  className: ""
  size: 20Gi

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 2560Mi

javaOpts: "-Xms1g -Xmx1536m -Djenkins.install.runSetupWizard=false -Dhudson.slaves.NodeProvisioner.initialDelay=0 -Dhudson.slaves.NodeProvisioner.recurrencePeriod=2000"
jenkinsOpts: "--webroot=/var/cache/jenkins/war --pluginroot=/var/cache/jenkins/plugins"

lease:
  duration: 15s
  renewDeadline: 10s

casc:
  configMapName: ""

secrets:
  secretName: ""

terminationGracePeriodSeconds: 30

# At each start, remove from JENKINS_HOME the plugins the controller image does not carry (the
# Jenkins image adds its plugins to JENKINS_HOME but never removes one). Off only for a
# controller whose plugins are managed in JENKINS_HOME, outside its image.
pluginsFromImageOnly: true

# Above build pods, so that a controller that lost its machine is given room (the netci chart
# creates netci-cell). Empty: the cluster's default priority.
priorityClassName: netci-cell

# A prometheus-operator PodMonitor for the cell agent's metrics (Lease held, Lease lost, JCasC
# reloads), which the netci chart's dashboard shows.
monitoring:
  enabled: false
  labels: {}

# Every build's log, as Jenkins writes it, also in Loki: readable (in Grafana) while the cell is
# taken over, when the controller and its volume are not. Fluent Bit beside the controller reads
# the build logs on the volume; builds are not slowed, and nothing is installed in Jenkins.
logShipping:
  enabled: false
  lokiUrl: ""        # e.g. http://loki.monitoring.svc.cluster.local:3100
  tenant: ""         # X-Scope-OrgID for a multi-tenant Loki
  # Fluent Bit, pinned by digest.
  image: ""          # e.g. cr.fluentbit.io/fluent/fluent-bit@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845 (5.1.3)
  ignoreOlder: 1d    # on a first install, the builds of the last day only
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}

# RBAC for the Jenkins Kubernetes plugin's agents in this namespace.
kubernetesPlugin:
  enabled: false

# How people reach the controller's web UI. The jenkins Service (ClusterIP) is always there.
ui:
  nodePort: null        # e.g. 30081: a NodePort Service, jenkins-ui
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""   # a kubernetes.io/tls Secret in the cell's namespace
    annotations: {}
