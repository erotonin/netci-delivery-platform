{{- if eq .Values.balancer.vip.mode "kubevip" }}
# kube-vip in services mode: one leader per Service holds the VIP and answers ARP for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    {{- include "netci-jenkins-ha.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netci-kube-vip
  labels:
    {{- include "netci-jenkins-ha.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, services/status, nodes, endpoints, pods]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netci-kube-vip
  labels:
    {{- include "netci-jenkins-ha.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netci-kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    {{- include "netci-jenkins-ha.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: kube-vip
  template:
    metadata:
      labels:
        app: kube-vip
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      tolerations:
        - operator: Exists
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-vip
          image: {{ include "netci-jenkins-ha.image" (list "images.kubeVip" .Values.images.kubeVip) }}
          args: [manager]
          env:
            - name: vip_arp
              value: "true"
            {{- if .Values.balancer.vip.interface }}
            - name: vip_interface
              value: {{ .Values.balancer.vip.interface | quote }}
            {{- end }}
            - name: svc_enable
              value: "true"
            - name: svc_election
              value: "true"
            - name: cp_enable
              value: "false"
            - name: vip_leaderelection
              value: "false"
            # How long a dead holder keeps the VIP: the lease must expire before another takes it.
            - name: vip_leaseduration
              value: "3"
            - name: vip_renewdeadline
              value: "2"
            - name: vip_retryperiod
              value: "1"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # This machine's own API server, not the kubernetes Service: that still lists a dead
            # machine's API server for a while, and each lease call that landed there hung 10 s, so
            # the VIP took 14-30 s to move instead of the lease's 3 (aa-phase2-20261013T094844Z).
            # Every lab machine is a control-plane node; on a site where they are not, this would
            # be the control plane's own VIP.
            - name: KUBERNETES_SERVICE_HOST
              value: "127.0.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
