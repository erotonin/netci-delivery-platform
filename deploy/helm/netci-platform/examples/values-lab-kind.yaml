# netCI in the lab's kind cluster, connected to the lab's existing Jenkins A/B.
#
# A worked example of a real install, not a template to copy blindly: every address here
# is the lab's. It holds no credential -- those are in the `netci-app` and
# `netci-deploy-targets` Secrets (docs/DEPLOY-KUBERNETES.md, "Secrets").
#
#   helm upgrade --install netci deploy/helm/netci-platform -n netci-system \
#     -f deploy/helm/netci-platform/examples/values-lab-kind.yaml
#
# The live lab stack keeps running beside it: its own database (netci_live), the
# library's `main` branch and the `netci-delivery` task queue. This install uses
# netci_k8s, `netci-shared-library@netci-0.2` and `netci-k8s-delivery`, so the two
# cannot take each other's builds or deployments.

global:
  environment: production
  externalUrl: http://netci.netci.local

image:
  registry: 172.17.0.1:55000/netci
  tag: 0.2.0-rc10

existingSecret: netci-app

jenkins:
  controllers:
    - {id: A, url: "http://172.17.0.50:8080", username: admin, executors: 2}
    - {id: B, url: "http://172.17.0.51:8080", username: admin, executors: 2}
  # The library version this install's jobs load. `main` is the live lab's.
  sharedLibrary: netci-shared-library@netci-0.2
  # Build agents are pods in this same cluster, so they call back on the Service directly.
  callbackUrl: http://netci-netci-platform-api.netci-system.svc:8000

temporal:
  address: 172.17.0.1:7233
  namespace: default
  taskQueue: netci-k8s-delivery

auth:
  mode: oidc
  oidc:
    # Keycloak stamps this issuer on every token whatever address it was asked at, so it
    # is compared as a string; the keys are fetched over an address pods can reach.
    issuer: http://127.0.0.1:8180/realms/netci
    audience: netci
    jwksUrl: http://172.17.0.1:8180/realms/netci/protocol/openid-connect/certs
    browserClientId: netci-portal
    roleMap: netci-admins=platform-admin,release-managers=reviewer,engineers=developer

registry:
  pushHost: 172.17.0.1:55000
  pullHost: 172.17.0.1:55000
  allowHttp: true
  buildBaseImage: 172.17.0.1:55000/netci/python-base:3.12-alpine
  trivyDbRepository: 172.17.0.1:55000/aquasec/trivy-db:2

supplyChain:
  # The lab signing key has no transparency log.
  signatureRequireTlog: false

# No DCIM for this proof: targets are named by hand and the inventory below is the list.
dcim:
  provider: ""
  requireRevalidation: false

buildIsolation:
  mode: none

deployTargets:
  existingSecret: netci-deploy-targets
  sshPrivateKeyFile: id_ed25519
  knownHostsFile: known_hosts
  inventory: |
    [docker_targets]
    netci-prod-02 ansible_host=172.17.0.60 ansible_user=netci netci_become=true

    [all:vars]
    ansible_python_interpreter=/usr/bin/python3
    netci_become=false

api: {replicas: 2}
worker: {replicas: 1}
portal: {replicas: 1}

ingress:
  enabled: true
  className: nginx
