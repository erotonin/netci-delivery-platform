{{- $component := "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netci.fullname" . }}-api
  labels:
    {{- include "netci.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "netci.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "netci.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- include "netci.labels" . | nindent 8 }}
      annotations:
        # A changed setting or credential rolls the pods; otherwise they keep running on
        # what they read at start-up while the ConfigMap says something else.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # netCI reaches clusters through kubeconfig files it is given, never through the
      # identity of the pod it runs in.
      automountServiceAccountToken: false
      securityContext:
        {{- include "netci.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      {{- if .Values.migrations.enabled }}
      initContainers:
        # The schema before the code. Every API pod runs this; scripts/migrate.py takes an
        # advisory lock, so the first pod applies what is pending and the rest find the
        # database up to date. The new code therefore never starts against an old schema.
        - name: migrate
          image: {{ include "netci.image" (dict "root" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "scripts/migrate.py"]
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/netci-app/database-url
          securityContext:
            {{- include "netci.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: app-secret, mountPath: /run/secrets/netci-app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      containers:
        - name: api
          image: {{ include "netci.image" (dict "root" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          envFrom:
            - configMapRef:
                name: {{ include "netci.fullname" . }}-config
          env:
            # kubectl keeps its discovery cache under $HOME; the root filesystem is
            # read-only, so $HOME is the scratch volume.
            - {name: HOME, value: /tmp}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "netci.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # /livez: the process answers. /healthz: it can reach PostgreSQL, without which
          # it cannot serve anything true. Not /readyz: that also asks Jenkins, Temporal
          # and DCIM, and as a readiness probe a Jenkins restart would take every API pod
          # out of rotation at once -- the portal would go dark over a dependency blip.
          # /readyz is scraped instead, as the netci_ready gauge on /metrics.
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: app-secret, mountPath: /run/secrets/netci-app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: app-secret
          secret:
            secretName: {{ include "netci.secretName" . }}
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netci.fullname" . }}-api
  labels:
    {{- include "netci.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "netci.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http, protocol: TCP}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.api.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "netci.fullname" . }}-api
  labels:
    {{- include "netci.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "netci.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
{{- end }}
