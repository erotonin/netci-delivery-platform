{{- /*
Everything netCI reads that is not a credential. Credentials are files under
/run/secrets/netci-app (see secret.yaml); the *_FILE variables below point at them, so no
token, key or connection string is ever an environment variable.
*/ -}}
{{- $root := . -}}
{{- if and (not .Values.dcim.provider) .Values.dcim.requireRevalidation }}
{{- fail "dcim.provider is empty while dcim.requireRevalidation is true: netCI would refuse every deployment, because it cannot confirm a target with no inventory. Configure a DCIM (netbox or http), or set dcim.requireRevalidation: false to state there is no inventory to check against." }}
{{- end }}
{{- if and (eq .Values.buildIsolation.mode "kubernetes") (not .Values.existingSecret) (not .Values.secrets.buildClusterKubeconfig) }}
{{- fail "buildIsolation.mode is kubernetes: secrets.buildClusterKubeconfig (or the build-cluster-kubeconfig key in existingSecret) is required" }}
{{- end }}
{{- if not .Values.jenkins.controllers }}
{{- fail "jenkins.controllers must name at least one controller" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netci.fullname" . }}-config
  labels:
    {{- include "netci.labels" . | nindent 4 }}
data:
  NETCI_ENVIRONMENT: {{ .Values.global.environment | quote }}
  # The browser origin. Not "*": credentials are sent, and a wildcard origin would let
  # any page a user visits call netCI as them.
  NETCI_ALLOWED_ORIGINS: {{ include "netci.externalUrl" . | quote }}
  DATABASE_URL_FILE: /run/secrets/netci-app/database-url
  NETCI_WORKLOAD_TOKEN_KEYS_FILE: /run/secrets/netci-app/workload-token-keys

  # people
  NETCI_AUTH_MODE: {{ .Values.auth.mode | quote }}
  {{- if eq .Values.auth.mode "oidc" }}
  NETCI_OIDC_ISSUER: {{ required "auth.oidc.issuer is required for auth.mode=oidc" .Values.auth.oidc.issuer | quote }}
  NETCI_OIDC_AUDIENCE: {{ required "auth.oidc.audience is required" .Values.auth.oidc.audience | quote }}
  {{- with .Values.auth.oidc.jwksUrl }}
  NETCI_OIDC_JWKS_URL: {{ . | quote }}
  {{- end }}
  NETCI_OIDC_BROWSER_CLIENT_ID: {{ .Values.auth.oidc.browserClientId | quote }}
  NETCI_OIDC_ROLES_CLAIM: {{ .Values.auth.oidc.rolesClaim | quote }}
  NETCI_OIDC_TEAMS_CLAIM: {{ .Values.auth.oidc.teamsClaim | quote }}
  NETCI_OIDC_ROLE_MAP: {{ required "auth.oidc.roleMap is required: which IdP groups are platform-admin, reviewer and developer" .Values.auth.oidc.roleMap | quote }}
  {{- end }}
  NETCI_REQUIRE_SEPARATION_OF_DUTIES: {{ .Values.auth.requireSeparationOfDuties | quote }}

  # CI: Jenkins
  NETCI_CI_MODE: jenkins
  {{- $ids := list }}
  {{- range .Values.jenkins.controllers }}{{ $ids = append $ids (required "every jenkins.controllers entry needs an id" .id) }}{{ end }}
  NETCI_JENKINS_CONTROLLERS: {{ join "," $ids | quote }}
  {{- range .Values.jenkins.controllers }}
  {{- $prefix := include "netci.jenkinsPrefix" .id }}
  {{ $prefix }}_URL: {{ required (printf "jenkins.controllers[id=%s].url is required" .id) .url | trimSuffix "/" | quote }}
  {{ $prefix }}_USERNAME: {{ required (printf "jenkins.controllers[id=%s].username is required" .id) .username | quote }}
  {{ $prefix }}_API_TOKEN_FILE: {{ printf "/run/secrets/netci-app/%s" (include "netci.jenkinsTokenKey" .id) | quote }}
  {{ $prefix }}_EXECUTORS: {{ .executors | default 2 | quote }}
  {{- end }}
  NETCI_CALLBACK_URL: {{ include "netci.callbackUrl" . | quote }}
  NETCI_AGENT_LABEL: {{ .Values.jenkins.agentLabel | quote }}
  NETCI_SHARED_LIBRARY: {{ .Values.jenkins.sharedLibrary | quote }}
  NETCI_CALLBACK_CREDENTIALS_ID: {{ .Values.jenkins.callbackCredentialsId | quote }}
  NETCI_COSIGN_CREDENTIALS_ID: {{ .Values.jenkins.cosignCredentialsId | quote }}
  NETCI_REGISTRY_PUSH_HOST: {{ required "registry.pushHost is required: where builds push images" .Values.registry.pushHost | quote }}
  NETCI_REGISTRY_PULL_HOST: {{ default .Values.registry.pushHost .Values.registry.pullHost | quote }}
  NETCI_REGISTRY_ALLOW_HTTP: {{ .Values.registry.allowHttp | quote }}
  {{- with .Values.registry.buildBaseImage }}
  NETCI_BUILD_BASE_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.registry.trivyDbRepository }}
  NETCI_TRIVY_DB_REPOSITORY: {{ . | quote }}
  {{- end }}

  # builds
  NETCI_BUILD_ISOLATION: {{ .Values.buildIsolation.mode | quote }}
  {{- if eq .Values.buildIsolation.mode "kubernetes" }}
  NETCI_BUILD_CLUSTER_KUBECONFIG: /run/secrets/netci-app/build-cluster-kubeconfig
  NETCI_BUILD_CONTROLLER_SERVICE_ACCOUNT: {{ .Values.buildIsolation.controllerServiceAccount | quote }}
  NETCI_BUILD_CACHE_SIZE: {{ .Values.buildIsolation.cacheSize | quote }}
  {{- with .Values.buildIsolation.cacheStorageClass }}
  NETCI_BUILD_CACHE_STORAGE_CLASS: {{ . | quote }}
  {{- end }}
  {{- end }}

  # CD: Temporal
  NETCI_CD_MODE: temporal
  TEMPORAL_ADDRESS: {{ required "temporal.address is required: host:port of the Temporal frontend" .Values.temporal.address | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
  # The worker reports deployment results and reads evidence here, inside the cluster.
  NETCI_API_URL: {{ include "netci.apiInternalUrl" . | quote }}

  # supply chain
  NETCI_REQUIRE_SECURITY_EVIDENCE: {{ .Values.supplyChain.requireSecurityEvidence | quote }}
  NETCI_SIGNATURE_VERIFY_MODE: {{ .Values.supplyChain.signatureVerifyMode | quote }}
  NETCI_SIGNATURE_REQUIRE_TLOG: {{ .Values.supplyChain.signatureRequireTlog | quote }}
  NETCI_REQUIRE_PROVENANCE: {{ .Values.supplyChain.requireProvenance | quote }}
  NETCI_SBOM_RESCAN: {{ .Values.supplyChain.sbomRescan | quote }}
  NETCI_SBOM_RESCAN_INTERVAL_SECONDS: {{ .Values.supplyChain.sbomRescanIntervalSeconds | quote }}
  NETCI_TRIVY_INSECURE: {{ .Values.registry.allowHttp | quote }}
  {{- with .Values.verification.prometheusUrl }}
  NETCI_PROMETHEUS_URL: {{ . | quote }}
  {{- end }}
  NETCI_COSIGN_PUBLIC_KEY_FILE: /run/secrets/netci-app/cosign.pub

  # inventory
  {{- if .Values.secrets.githubToken }}
  NETCI_GITHUB_TOKEN_FILE: /run/secrets/netci-app/scm-github-token
  {{- end }}
  {{- if .Values.secrets.gitlabToken }}
  NETCI_GITLAB_TOKEN_FILE: /run/secrets/netci-app/scm-gitlab-token
  {{- end }}
  {{- with .Values.scm.githubApiUrl }}
  NETCI_GITHUB_API_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.scm.gitlabUrl }}
  NETCI_GITLAB_URL: {{ . | quote }}
  {{- end }}
  NETCI_REQUIRE_DCIM_REVALIDATION: {{ .Values.dcim.requireRevalidation | quote }}
  {{- if .Values.dcim.provider }}
  NETCI_DCIM_PROVIDER: {{ .Values.dcim.provider | quote }}
  NETCI_DCIM_BASE_URL: {{ required "dcim.baseUrl is required when dcim.provider is set" .Values.dcim.baseUrl | quote }}
  NETCI_DCIM_API_TOKEN_FILE: /run/secrets/netci-app/dcim-api-token
  {{- end }}

  # progressive delivery
  {{- if .Values.traffic.router }}
  NETCI_TRAFFIC_ROUTER: {{ .Values.traffic.router | quote }}
  NETCI_TRAFFIC_KUBECONFIG: /run/secrets/netci-app/traffic-kubeconfig
  {{- end }}

  # deployment targets (worker)
  NETCI_ANSIBLE_INVENTORY: /etc/netci/ansible/inventory.ini
  NETCI_ANSIBLE_SECRET_DIR: /run/secrets/netci
  NETCI_KUBECONFIG_DIR: /run/secrets/netci
  NETCI_ANSIBLE_COLLECTIONS_PATH: /opt/ansible/collections
  {{- with .Values.deployTargets.sshPrivateKeyFile }}
  NETCI_ANSIBLE_PRIVATE_KEY_FILE: {{ printf "/run/secrets/netci/%s" . | quote }}
  {{- end }}
  {{- with .Values.deployTargets.knownHostsFile }}
  NETCI_ANSIBLE_KNOWN_HOSTS_FILE: {{ printf "/run/secrets/netci/%s" . | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netci.fullname" . }}-ansible-inventory
  labels:
    {{- include "netci.labels" . | nindent 4 }}
data:
  inventory.ini: |
    {{- .Values.deployTargets.inventory | nindent 4 }}
