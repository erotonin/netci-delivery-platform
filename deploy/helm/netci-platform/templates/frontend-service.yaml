apiVersion: v1
kind: Service
metadata:
  name: {{ include "netci.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netci.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "netci.fullname" . }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "netci.fullname" . }}-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      protocol: TCP
