{{- if .Values.ingress.enabled }}
{{- $url := urlParse (include "netci.externalUrl" .) }}
{{- $host := regexReplaceAll ":[0-9]+$" $url.host "" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netci.fullname" . }}
  labels:
    {{- include "netci.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.className "nginx" }}
    # Console output is Server-Sent Events: buffered, it arrives in one lump when the
    # build ends, and the default 60s read timeout cuts it off before most builds do.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    # One entry point. The portal serves the browser and proxies /api to the API, so the
    # two share an origin. The previous chart also sent /api straight to the API without
    # stripping the prefix -- the API serves /me, not /api/me, so every call 404'd -- and
    # published /metrics, which runs every readiness probe on each request, to the world.
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "netci.fullname" . }}-portal
                port: {name: http}
{{- end }}
