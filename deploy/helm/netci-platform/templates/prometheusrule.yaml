{{- /*
SLOs and alerts for netCI itself (docs/SLO.md). Rendered only when enabled: it needs the
Prometheus Operator's CRD. Health probes are excluded from the SLO -- /livez and /healthz
answer every few seconds and would drown real traffic in successes.
*/ -}}
{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $target := .Values.monitoring.slo.availabilityTarget | float64 }}
{{- $budget := subf 1.0 $target }}
{{- $api := `route!~"/livez|/healthz|/readyz|/metrics"` }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "netci.fullname" . }}-slo
  labels:
    {{- include "netci.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: netci-slo-recording
      rules:
        {{- range $window := list "5m" "30m" "1h" "6h" "30d" }}
        - record: netci:api_error_ratio:rate{{ $window }}
          expr: |
            sum(rate(netci_http_requests_total{ {{ $api }},status_code=~"5.." }[{{ $window }}]))
            /
            sum(rate(netci_http_requests_total{ {{ $api }} }[{{ $window }}]))
        {{- end }}
        - record: netci:api_latency_p95_seconds:rate5m
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(netci_http_request_duration_seconds_bucket{ {{ $api }} }[5m])))
    - name: netci-slo-alerts
      rules:
        - alert: NetciApiAvailabilityBurnFast
          # 14.4x the allowed error rate for an hour spends 2 % of a 30-day budget; the
          # 5-minute window makes the alert stop as soon as the burning stops.
          expr: |
            netci:api_error_ratio:rate1h > {{ mulf 14.4 $budget }}
            and
            netci:api_error_ratio:rate5m > {{ mulf 14.4 $budget }}
          labels:
            severity: page
          annotations:
            summary: netCI API is failing requests fast enough to exhaust its monthly error budget in about two days
            description: >-
              More than {{ mulf 14.4 $budget | mulf 100 }} % of API requests (health probes excluded) return 5xx over both the last
              hour and the last five minutes. Check first: `kubectl logs` of the API pods for the failing route, then
              /readyz for a dependency (PostgreSQL, Temporal, Jenkins) that went away.
        - alert: NetciApiAvailabilityBurnSlow
          expr: |
            netci:api_error_ratio:rate6h > {{ mulf 6.0 $budget }}
            and
            netci:api_error_ratio:rate30m > {{ mulf 6.0 $budget }}
          labels:
            severity: ticket
          annotations:
            summary: netCI API errors are eating the error budget steadily
            description: >-
              More than {{ mulf 6.0 $budget | mulf 100 }} % of API requests return 5xx over six hours and thirty minutes. Check
              which route: `sum by (route) (rate(netci_http_requests_total{status_code=~"5.."}[30m]))`.
        - alert: NetciApiLatencyHigh
          expr: netci:api_latency_p95_seconds:rate5m > {{ .Values.monitoring.slo.latencyP95Seconds }}
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: netCI API p95 latency above {{ .Values.monitoring.slo.latencyP95Seconds }} s for 15 minutes
            description: >-
              Check `netci_database_pool_connections` (pool exhaustion) and slow routes:
              `histogram_quantile(0.95, sum by (le, route) (rate(netci_http_request_duration_seconds_bucket[5m])))`.
        - alert: NetciNotReady
          expr: max(netci_ready) == 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: No netCI API replica reports ready
            description: >-
              /readyz fails on every replica. `netci_dependency_ready` names the dependency that is down.
        - alert: NetciNoCiController
          expr: max(netci_ci_controllers_healthy) == 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: No Jenkins controller is reachable; no build can start
            description: >-
              `netci_ci_controllers_unreachable` counts the ones netCI tried. Check the controller URL and API token
              (scripts/jenkins_preflight.py runs the same checks read-only).
        - alert: NetciNoCdPoller
          expr: max(netci_cd_pollers) == 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: No worker polls the Temporal task queue; no deployment can run
            description: >-
              Deployments stay "deploying" with nothing executing them. Check the worker pods and their TEMPORAL_ADDRESS.
        - alert: NetciOutboxBacklog
          expr: max(netci_notification_outbox_queue_depth) > 100
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: Notifications and SCM statuses are queuing faster than they are delivered
            description: >-
              Check the API logs for "Notification delivery failed" and the destination they name.
        - alert: NetciOutboxDeadLetters
          expr: sum(increase(netci_notifications_total{status="dead_letter"}[1h])) > 0
          labels:
            severity: ticket
          annotations:
            summary: Notifications were given up on after every retry
            description: >-
              A commit status or notification will never arrive. `event_type` on the metric says which kind; a missing
              SCM token is the usual cause for scm.* events.
        - alert: NetciReconcilerCorrecting
          expr: sum(rate(netci_reconciler_corrections_total[30m])) > 0
          for: 30m
          labels:
            severity: ticket
          annotations:
            summary: The reconciler keeps correcting runs or deployments -- callbacks are being lost
            description: >-
              Jenkins or the worker cannot reach netCI's callback URL, or reaches it and is refused. Check
              NETCI_CALLBACK_URL and the API logs for 401/403 on /pipeline-runs/*/ci-result.
{{- end }}
