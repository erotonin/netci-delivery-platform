{{- /*
Rendered only without `existingSecret`. Each key becomes a file under
/run/secrets/netci-app, which is what the *_FILE settings in configmap.yaml point at.
Every value is `required` and none has a default: the chart deploys in production mode,
and a default here would be a credential published in this repository -- the workload
signing key especially, since it is what mints the tokens builds and deployments use.
*/ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netci.secretName" . }}
  labels:
    {{- include "netci.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required (or set existingSecret)" .Values.secrets.databaseUrl | quote }}
  workload-token-keys: {{ required "secrets.workloadTokenKeys is required: the workload-identity signing key, never a default" .Values.secrets.workloadTokenKeys | quote }}
  cosign.pub: {{ required "secrets.cosignPublicKey is required while supplyChain.signatureVerifyMode is cosign" .Values.secrets.cosignPublicKey | quote }}
  {{- range .Values.jenkins.controllers }}
  {{ include "netci.jenkinsTokenKey" .id }}: {{ required (printf "secrets.jenkinsApiTokens.%s is required: the API token of jenkins.controllers[id=%s].username" .id .id) (index $.Values.secrets.jenkinsApiTokens .id) | quote }}
  {{- end }}
  {{- if .Values.dcim.provider }}
  dcim-api-token: {{ required "secrets.dcimApiToken is required when dcim.provider is set" .Values.secrets.dcimApiToken | quote }}
  {{- end }}
  {{- if eq .Values.buildIsolation.mode "kubernetes" }}
  build-cluster-kubeconfig: {{ .Values.secrets.buildClusterKubeconfig | quote }}
  {{- end }}
  {{- if .Values.traffic.router }}
  traffic-kubeconfig: {{ required "secrets.trafficKubeconfig is required when traffic.router is set" .Values.secrets.trafficKubeconfig | quote }}
  {{- end }}
{{- end }}
