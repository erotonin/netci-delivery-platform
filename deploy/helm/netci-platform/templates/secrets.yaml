apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netci.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netci.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- else }}
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
  {{- end }}
  JENKINS_A_USERNAME: {{ .Values.jenkins.username | quote }}
  JENKINS_A_API_TOKEN: {{ .Values.jenkins.apiToken | quote }}
  NETCI_PIPELINE_API_KEY: {{ .Values.security.pipelineApiKey | quote }}
  NETCI_WORKLOAD_TOKEN_KEYS: {{ .Values.security.workloadTokenKeys | quote }}
  NETCI_COSIGN_PUBLIC_KEY: {{ .Values.security.cosignPublicKey | quote }}
