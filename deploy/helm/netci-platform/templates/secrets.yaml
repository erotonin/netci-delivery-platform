apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netci.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netci.labels" . | nindent 4 }}
type: Opaque
# Every credential below is `required`. The chart deploys with
# NETCI_ENVIRONMENT=production, where a missing secret must stop the install rather
# than bring up a control plane anyone can mint tokens against -- shipping a default
# for workloadTokenKeys would publish the signing key in this repository. `helm
# install` with no -f now fails naming the value it wants, which is the point: a
# chart that starts on placeholders is indistinguishable from one truly configured.
stringData:
  {{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- else }}
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ required "database.password is required (or set database.url)" .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
  {{- end }}
  JENKINS_A_USERNAME: {{ .Values.jenkins.username | quote }}
  JENKINS_A_API_TOKEN: {{ required "jenkins.apiToken is required: the Jenkins service-account API token" .Values.jenkins.apiToken | quote }}
  NETCI_PIPELINE_API_KEY: {{ required "security.pipelineApiKey is required" .Values.security.pipelineApiKey | quote }}
  NETCI_WORKLOAD_TOKEN_KEYS: {{ required "security.workloadTokenKeys is required: the workload-identity signing key, never a default" .Values.security.workloadTokenKeys | quote }}
  NETCI_COSIGN_PUBLIC_KEY: {{ required "security.cosignPublicKey is required while security.signatureVerifyMode is cosign" .Values.security.cosignPublicKey | quote }}
