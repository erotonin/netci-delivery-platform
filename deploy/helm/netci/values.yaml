image:
  repository: ""
  digest: ""

imagePullSecrets: []

supervisor:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
  machines: ""
  fence:
    addr: ""
    user: ""
    secretName: ""
    # configSecretName: ""
  autoPowerOn: false
  panicFraction: 0.5

queue:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  database:
    secretName: ""
    key: "url"
  config: {}
  cellCredentials:
    secretName: ""
    items: []
  service:
    type: ClusterIP
    # nodePort: 30090

fabric:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  sandboxNamespace: netci-agents
  createSandboxNamespace: true
  database:
    secretName: ""
    key: "url"
  config: {}

# prometheus-operator PodMonitors and alert rules (monitoring.coreos.com/v1).
monitoring:
  enabled: false
  labels: {}
  # A Grafana dashboard as a ConfigMap, for Grafana's dashboard sidecar.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

# PriorityClasses netci-platform, netci-cell and netci-sandbox (cluster-scoped), used by this chart
# and by netci-cell. Turn off only if they are managed elsewhere under the same names.
priorityClasses:
  create: true
