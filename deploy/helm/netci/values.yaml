image:
  repository: ""
  digest: ""

imagePullSecrets: []

supervisor:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
  machines: ""
  fence:
    addr: ""
    user: ""
    secretName: ""
    # configSecretName: ""   # a Secret holding fence.json (internal/fence/config.go) and credentials
    # Maps the config Secret's keys to the paths fence.json names, e.g.
    #   - {key: fence.json, path: fence.json}
    #   - {key: bmc-worker-7.username, path: bmc-worker-7/username}
    #   - {key: bmc-worker-7.password, path: bmc-worker-7/password}
    #   - {key: bmc-worker-7.tls-sha256, path: bmc-worker-7/tls-sha256}
    items: []
  autoPowerOn: false
  panicFraction: 0.5
  # Power controllers' timing. queryTimeout bounds each power-state query: a BMC slower than it
  # reads as Unknown and is never fenced (set Redfish's requestTimeout in fence.json to match).
  # offTimeout: how long a machine has, after the power-off, to report Off. Real BMCs answer in
  # 0.5-3 s, can be busy, and report Off seconds after a ForceOff: a test BMC answering in 1.5 s,
  # busy once and 8 s late took 22 s, past the old 20 s. A longer timeout costs nothing when the
  # BMC is quick; it only delays the alert when it never says Off. 60 s, as Ironic's
  # power_state_change_timeout.
  power:
    queryTimeout: 3s
    offTimeout: 60s
  # How long after fencing a machine the cells' pods on it are deleted, which starts their volumes'
  # detach. Asked for while the storage is still taking in that the node is gone, a detach can
  # wait for the dead machine: in the lab, Longhorn spent ~10 s on each cell deleted within 0.3 s
  # (5 of 5). The cells' Leases are released at fencing, so nothing else waits. "0" for storage
  # that does not need it.
  storageSettle: 3s

queue:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  database:
    secretName: ""
    key: "url"
  config: {}
  cellCredentials:
    secretName: ""
    items: []
  service:
    type: ClusterIP
    # nodePort: 30090
  # HTTPS for webhooks and API clients from outside the cluster; TLS is required.
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""
    annotations: {}

fabric:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  sandboxNamespace: netci-agents
  createSandboxNamespace: true
  # What build sandboxes may reach (a NetworkPolicy in their namespace): DNS, the fabric, the
  # cells' controllers, and addresses outside the cluster. clusterCIDRs is required: the pod,
  # service and node ranges, which sandboxes may not reach. extraEgress adds NetworkPolicy egress
  # rules, e.g. an artifact repository inside one of those ranges.
  networkPolicy:
    enabled: true
    clusterCIDRs: []
    extraEgress: []
  database:
    secretName: ""
    key: "url"
  config: {}

# prometheus-operator PodMonitors and alert rules (monitoring.coreos.com/v1).
monitoring:
  enabled: false
  labels: {}
  # A Grafana dashboard as a ConfigMap, for Grafana's dashboard sidecar.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

# PriorityClasses netci-platform, netci-cell and netci-sandbox (cluster-scoped), used by this chart
# and by netci-cell. Turn off only if they are managed elsewhere under the same names.
priorityClasses:
  create: true
