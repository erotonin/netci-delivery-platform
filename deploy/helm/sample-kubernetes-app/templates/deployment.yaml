apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-kubernetes-app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    netci/environment: {{ .Values.environment | quote }}
    netci.io/track: {{ include "sample-kubernetes-app.track" . | quote }}
    netci.io/environment: {{ .Values.environment | quote }}
    {{- if .Values.netci.applicationId }}
    netci.io/application: {{ .Values.netci.applicationId | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required; deploy by immutable digest" .Values.image.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NETCI_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.digest | quote }}
            - name: NETCI_TRACK
              value: {{ include "sample-kubernetes-app.track" . | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
