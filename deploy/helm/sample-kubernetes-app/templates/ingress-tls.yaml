{{- if or .Values.ingress.enabled (and .Values.traits (and .Values.traits.autoTlsIngress .Values.traits.autoTlsIngress.enabled)) -}}
{{- $stable := .Values.netci.releaseName | default .Release.Name -}}
{{- $host := .Values.ingress.host | default .Values.traits.autoTlsIngress.host | default (printf "%s.%s.netci.local" $stable .Values.environment) -}}
{{- $secretName := .Values.traits.autoTlsIngress.tlsSecretName | default (printf "%s-tls" (include "sample-kubernetes-app.fullname" .)) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sample-kubernetes-app.fullname" . }}-ingress
  labels:
    app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    netci.io/trait: auto-tls-ingress
    netci.io/environment: {{ .Values.environment | quote }}
    netci.io/track: {{ ternary "canary" "stable" .Values.canary.enabled | quote }}
    {{- if .Values.netci.applicationId }}
    netci.io/application: {{ .Values.netci.applicationId | quote }}
    {{- end }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.traits.autoTlsIngress.clusterIssuer | default "selfsigned-issuer" | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- if .Values.canary.enabled }}
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ .Values.canary.weight | int | quote }}
    {{- if .Values.canary.header }}
    nginx.ingress.kubernetes.io/canary-by-header: {{ .Values.canary.header | quote }}
    {{- if .Values.canary.headerValue }}
    nginx.ingress.kubernetes.io/canary-by-header-value: {{ .Values.canary.headerValue | quote }}
    {{- end }}
    {{- end }}
    {{- if .Values.canary.cookie }}
    nginx.ingress.kubernetes.io/canary-by-cookie: {{ .Values.canary.cookie | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $secretName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sample-kubernetes-app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "sample-kubernetes-app.fullname" . }}-cert
  labels:
    app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
    netci.io/trait: auto-tls-ingress
spec:
  secretName: {{ $secretName | quote }}
  issuerRef:
    name: {{ .Values.traits.autoTlsIngress.clusterIssuer | default "selfsigned-issuer" }}
    kind: ClusterIssuer
  dnsNames:
    - {{ $host | quote }}
{{- end }}
