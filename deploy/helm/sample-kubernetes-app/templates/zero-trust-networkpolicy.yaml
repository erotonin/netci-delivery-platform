{{- if and .Values.traits (and .Values.traits.zeroTrustGuard .Values.traits.zeroTrustGuard.enabled) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sample-kubernetes-app.fullname" . }}-zero-trust
  labels:
    app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    netci.io/trait: zero-trust-guard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sample-kubernetes-app.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress only from matching pods in current namespace or labeled ingress gateways
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow DNS resolution within cluster
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to approved internal services
    - to:
        - podSelector: {}
{{- end }}
