replicaCount: 1

image:
  repository: registry.localhost:5000/hello-kubernetes
  digest: "sha256:REPLACE_WITH_VERIFIED_DIGEST"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

environment: dev
