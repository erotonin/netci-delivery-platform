apiVersion: v1
kind: ConfigMap
metadata:
  name: netci-config
  namespace: netci
  labels:
    app.kubernetes.io/part-of: netci-platform
data:
  NETCI_ENVIRONMENT: "production"
  NETCI_CI_MODE: "jenkins"
  NETCI_JENKINS_CONTROLLERS: "A"
  # Target company Jenkins endpoint (change this to the real VTNet Jenkins URL):
  JENKINS_A_URL: "http://jenkins.vtnet.viettel.vn:8080"
  NETCI_AGENT_LABEL: "netci-ephemeral"
  NETCI_BUILD_NAMESPACE: "netci-build"
  # Registry hosts for artifact pushing and pulling:
  REGISTRY_PUSH_HOST: "harbor.vtnet.viettel.vn"
  REGISTRY_PULL_HOST: "harbor.vtnet.viettel.vn"
  NETCI_TRIVY_DB_REPOSITORY: "harbor.vtnet.viettel.vn/security/trivy-db"
  # Internal service URLs:
  NETCI_API_URL: "http://netci-backend.netci.svc.cluster.local:8000"
  TEMPORAL_HOST: "temporal-frontend.temporal.svc.cluster.local:7233"
  NETCI_ALLOWED_ORIGINS: "*"
  # Supply chain security policies:
  NETCI_REQUIRE_SECURITY_EVIDENCE: "true"
  NETCI_SIGNATURE_VERIFY_MODE: "cosign"
  NETCI_RATE_LIMIT: "120"
  NETCI_RATE_LIMIT_WINDOW: "60"
