apiVersion: v1
kind: Secret
metadata:
  name: netci-secrets
  namespace: netci
  labels:
    app.kubernetes.io/part-of: netci-platform
type: Opaque
stringData:
  # Database connection string:
  DATABASE_URL: "postgresql://netci:ChangeMeSecurePassword@postgres.netci.svc.cluster.local:5432/netci?sslmode=disable"
  
  # Jenkins Authentication (Service Account on VTNet Jenkins):
  JENKINS_A_USERNAME: "netci-sa"
  JENKINS_A_API_TOKEN: "11a1b2c3d4e5f60718293a4b5c6d7e8f90"
  
  # Callback Key between Jenkins and netCI API:
  NETCI_PIPELINE_API_KEY: "netci-enterprise-production-key-change-me"
  
  # Workload Identity token signing key (HS256 secret or RSA private key):
  NETCI_WORKLOAD_TOKEN_KEYS: "k1:ChangeMeToA32CharacterSecureSigningKey!"
  
  # Cosign public key for container signature verification:
  NETCI_COSIGN_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEexamplePublicKeyChangeMeToRealKey...
    -----END PUBLIC KEY-----
