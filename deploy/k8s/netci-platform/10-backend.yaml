apiVersion: apps/v1
kind: Deployment
metadata:
  name: netci-backend
  namespace: netci
  labels:
    app.kubernetes.io/name: netci-backend
    app.kubernetes.io/part-of: netci-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netci-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netci-backend
        app.kubernetes.io/part-of: netci-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: harbor.vtnet.viettel.vn/netci/backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: netci-config
            - secretRef:
                name: netci-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: netci-backend
  namespace: netci
  labels:
    app.kubernetes.io/name: netci-backend
    app.kubernetes.io/part-of: netci-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netci-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
