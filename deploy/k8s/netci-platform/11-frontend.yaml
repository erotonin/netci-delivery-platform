apiVersion: apps/v1
kind: Deployment
metadata:
  name: netci-frontend
  namespace: netci
  labels:
    app.kubernetes.io/name: netci-frontend
    app.kubernetes.io/part-of: netci-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netci-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netci-frontend
        app.kubernetes.io/part-of: netci-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: harbor.vtnet.viettel.vn/netci/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: netci-frontend
  namespace: netci
  labels:
    app.kubernetes.io/name: netci-frontend
    app.kubernetes.io/part-of: netci-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netci-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
