worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    include /tmp/api-upstream.conf;

    # Websocket upgrade when asked for, ordinary keep-alive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        include /tmp/csp.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Keep the browser and API on one origin. The trailing slash on
        # proxy_pass intentionally removes /api before FastAPI sees the path.
        # Not through the public entry point. Every request to /metrics runs the whole
        # readiness probe -- Jenkins, Temporal, DCIM, cosign -- so publishing it hands an
        # anonymous caller both the platform's internals and a way to make it call out.
        # Prometheus scrapes the API Service inside the cluster instead.
        location = /api/metrics {
            return 404;
        }

        location /api/ {
            proxy_pass http://netci_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
        }

        # Console output is Server-Sent Events. Buffered, the lines arrived in one lump
        # when the build ended; with the default read timeout the stream was cut at 65s,
        # which is shorter than most builds.
        location ~ ^/api/(pipeline-runs/[^/]+/logs/stream)$ {
            proxy_pass http://netci_api/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
