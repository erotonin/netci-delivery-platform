# The company's GitLab, as a VM-like container outside the cluster (as most companies run
# it). Trimmed to what netCI needs -- repositories, the API, webhooks -- so it fits the lab:
# puma in single mode, sidekiq small, every bundled monitor and the registry off (Harbor is
# the registry).
name: netci-corp-gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:19.4.1-ce.0
    container_name: netci-corp-gitlab
    hostname: gitlab.corp.local
    restart: unless-stopped
    mem_limit: 3g
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://172.17.0.1:8929'
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/gitlab_root_password').strip
        gitlab_rails['gitlab_shell_ssh_port'] = 0
        gitlab_sshd['enable'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        registry['enable'] = false
        mattermost['enable'] = false
        gitlab_pages['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        # Webhooks to netCI on the docker bridge are "local network" requests to GitLab.
    ports:
      - '172.17.0.1:8929:8929'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - ../../../.netci-gate/corp/gitlab_root_password:/run/secrets/gitlab_root_password:ro
    # Also on the kind network, as a company GitLab shares a network with its clusters: it
    # delivers merge webhooks to netCI (infra/corp/netci/webhook-nodeport.yaml). This host
    # runs Docker with IP forwarding off, so a container on its own network cannot reach the
    # cluster nodes at all.
    networks: [default, kind]
networks:
  kind:
    external: true
volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
