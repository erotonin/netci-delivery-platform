# A company-shaped cluster on one machine: three control-plane nodes (HA etcd and API
# server behind kind's load balancer) and three workers. Everything the lab can run
# small, it runs small; the shape is what matters for failover and scheduling.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netci-corp
networking:
  podSubnet: 10.246.0.0/16
  serviceSubnet: 10.98.0.0/16
containerdConfigPatches:
  # Registries are configured per host in /etc/containerd/certs.d (containerd 2.x): Harbor
  # (infra/corp/harbor) over TLS verified against the lab CA, the old lab registry over HTTP.
  # scripts/corp/up.sh renders that directory into .netci-gate/corp/containerd-certs.d and
  # mounts it into every node (__CERTS_D__ is replaced with its absolute path).
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraMounts: [{hostPath: __CERTS_D__, containerPath: /etc/containerd/certs.d, readOnly: true}]
  - role: control-plane
    extraMounts: [{hostPath: __CERTS_D__, containerPath: /etc/containerd/certs.d, readOnly: true}]
  - role: control-plane
    extraMounts: [{hostPath: __CERTS_D__, containerPath: /etc/containerd/certs.d, readOnly: true}]
  # Build pods run on the ci pool (two nodes). The Jenkins controller may run on either of
  # two eligible nodes: failover (ADR-055) needs somewhere else to restore to.
  - role: worker
    labels: {netci.io/pool: ci}
    extraMounts: [{hostPath: __CERTS_D__, containerPath: /etc/containerd/certs.d, readOnly: true}]
  - role: worker
    labels: {netci.io/pool: ci, netci.io/jenkins-controller: eligible}
    extraMounts: [{hostPath: __CERTS_D__, containerPath: /etc/containerd/certs.d, readOnly: true}]
  - role: worker
    labels: {netci.io/pool: platform, netci.io/jenkins-controller: eligible}
    extraMounts: [{hostPath: __CERTS_D__, containerPath: /etc/containerd/certs.d, readOnly: true}]
