# TLS in front of SeaweedFS's S3 API (ADR-055). SeaweedFS 4.47's own TLS listener stalled the
# handshake (it answered a ClientHello with a HelloRetryRequest and then nothing, also inside
# its own network), so TLS is terminated here -- the usual shape for an object store behind a
# gateway. The plain side is SeaweedFS on the compose network only, never published.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  server {
    listen 8333 ssl;
    ssl_certificate     /run/secrets/s3.crt;   # leaf + lab CA
    ssl_certificate_key /run/secrets/s3.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Kopia packs and Velero tarballs: no size limit, no buffering to disk on the way.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location / {
      proxy_pass http://seaweedfs:8333;
      # S3 signatures cover the Host header: pass the client's, unchanged.
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
