kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netci-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.localhost:5000"]
      endpoint = ["http://registry.localhost:5000"]
