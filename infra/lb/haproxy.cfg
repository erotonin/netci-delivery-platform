# L7 load balancer in front of the netCI API replicas (ADR-032 consequence).
#
# HAProxy rather than nginx open source: active health checks are what pull a dead
# replica out of rotation before a user hits it, and nginx OSS only has passive ones.
# The check is /healthz -- the replica's own statement that its database is reachable
# (503 when degraded). /readyz would also pull a replica whose *Jenkins* is down, which
# is a platform fact, not a reason to stop answering reads; /livez would keep a replica
# whose database connection is broken.
#
# WebSockets (edge agents on /api/v1/agents/ws) pass through: HAProxy switches to tunnel
# mode on Upgrade; `timeout tunnel` keeps idle agent sockets alive between heartbeats.
# Which replica holds an agent no longer matters (agent_connections/agent_commands are
# in PostgreSQL), so no stickiness is configured for them.
global
  log stdout format raw local0 info
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  option forwardfor
  option http-server-close
  timeout connect 5s
  timeout client  60s
  timeout server  60s
  timeout tunnel  1h
  timeout http-request 15s
  # A connection refused by a replica that just died is retried on the other one, so
  # the seconds between the death and the health check noticing cost no request.
  retries 3
  option redispatch

frontend netci_api
  bind 0.0.0.0:8000
  # The replica that answered, for the person reading a response or a log.
  http-response set-header X-NetCI-Replica %[srv_name]
  default_backend netci_api_replicas

backend netci_api_replicas
  # Round robin, not leastconn: an edge agent's long-lived websocket counts as one
  # open connection and leastconn then steered every short request to the other
  # replica (observed: 13/13 callbacks of a build on one replica).
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  # 2 failed checks (5 s apart) remove a replica; 2 passing ones return it.
  default-server inter 5s fall 2 rise 2
  server api-a 127.0.0.1:8100 check
  server api-b 127.0.0.1:8101 check

listen stats
  bind 127.0.0.1:8404
  stats enable
  stats uri /
  stats refresh 5s
