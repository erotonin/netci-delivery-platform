# Prometheus for netCI. Scrapes every API replica's /metrics; the replica publishes its
# own readiness verdict and its dependencies' as gauges, so the alerts below fire on what
# netCI itself would refuse to do, not on a synthetic probe.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: netci-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8100"]
        labels: {replica: api-a}
      - targets: ["127.0.0.1:8101"]
        labels: {replica: api-b}
