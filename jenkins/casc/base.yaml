jenkins:
  numExecutors: 0
  mode: EXCLUSIVE
  quietPeriod: 0
  remotingSecurity:
    enabled: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD:-change-me-local-only}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  globalLibraries:
    libraries:
      - name: netci-shared-library
        defaultVersion: main
        implicit: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: file:///var/jenkins_home/shared-library

credentials:
  system:
    domainCredentials:
      - credentials: []

jobs:
  - script: |
      pipelineJob('netci-seed') {
        description('Managed by JCasC. Creates or updates netCI template jobs.')
        definition {
          cps {
            script('''@Library("netci-shared-library") _\nnetciPipeline(template: "container-ci-cd-v1")''')
            sandbox(true)
          }
        }
      }

kubernetes:
  enabled: true
