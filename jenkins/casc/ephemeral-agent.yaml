jenkins:
  clouds:
    - kubernetes:
        name: netci-kind
        serverUrl: ${KUBERNETES_API_URL:-https://netci-local-control-plane:6443}
        serverCertificate: ${KUBERNETES_SERVER_CA:-}
        namespace: ${JENKINS_AGENT_NAMESPACE:-netci-build}
        skipTlsVerify: false
        credentialsId: ${KUBERNETES_CREDENTIALS_ID:-netci-kind-token}
        # Both controllers are attached to the kind Docker network by
        # infra/kind/local-registry.sh. The compose service name comes from
        # JENKINS_CONTROLLER_ID (jenkins-a or jenkins-b).
        jenkinsUrl: http://${JENKINS_CONTROLLER_ID}:8080
        webSocket: true
        containerCapStr: "10"
        maxRequestsPerHostStr: "32"
        podRetention: never
        templates:
          - name: netci-ephemeral
            label: netci-ephemeral
            namespace: ${JENKINS_AGENT_NAMESPACE:-netci-build}
            serviceAccount: ${JENKINS_AGENT_SERVICE_ACCOUNT:-jenkins-agent}
            nodeUsageMode: EXCLUSIVE
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            podRetention: never
            idleMinutes: 0
            yaml: |
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  netci.io/agent: ephemeral
              spec:
                automountServiceAccountToken: false
                serviceAccountName: ${JENKINS_AGENT_SERVICE_ACCOUNT:-jenkins-agent}
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                containers:
                  - name: jnlp
                    image: ${JENKINS_INBOUND_AGENT_IMAGE:-jenkins/inbound-agent:3386.v353e57a_1b_ea_0-1-jdk21}
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "256Mi"
                      limits:
                        cpu: "500m"
                        memory: "1Gi"
                  - name: builder
                    image: ${JENKINS_TOOLBOX_IMAGE:-netci/ci-toolbox:0.1.0}
                    command: ["sleep"]
                    args: ["99d"]
                    tty: true
                    env:
                      - name: BUILDAH_ISOLATION
                        value: chroot
                      - name: STORAGE_DRIVER
                        value: vfs
                    # Rootless Buildah invokes its setuid uidmap helpers. The
                    # pod still runs as uid 1000 and has no hostPath/socket.
                    securityContext:
                      allowPrivilegeEscalation: true
                    resources:
                      requests:
                        cpu: "500m"
                        memory: "1Gi"
                      limits:
                        cpu: "2"
                        memory: "4Gi"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: ${KUBERNETES_CREDENTIALS_ID:-netci-kind-token}
              scope: SYSTEM
              description: "Short-lived token for the local kind controller service account"
              secret: ${KUBERNETES_SERVICE_ACCOUNT_TOKEN:-replace-me-local-only}
