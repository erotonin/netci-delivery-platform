jenkins:
  clouds:
    - kubernetes:
        name: netci-kind
        serverUrl: ${KUBERNETES_API_URL:-https://kubernetes.default.svc}
        namespace: netci-build
        skipTlsVerify: false
        credentialsId: ${KUBERNETES_CREDENTIALS_ID:-netci-kind-token}
        jenkinsUrl: ${JENKINS_AGENT_URL:-http://host.docker.internal:8081}
        jenkinsTunnel: ${JENKINS_AGENT_TUNNEL:-host.docker.internal:50001}
        containerCapStr: "10"
        maxRequestsPerHostStr: "32"
        podRetention: never
        templates:
          - name: netci-ephemeral
            label: netci-ephemeral
            serviceAccount: jenkins-agent
            idleMinutes: 0
            yaml: |
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  netci.io/agent: ephemeral
              spec:
                serviceAccountName: jenkins-agent
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                containers:
                  - name: jnlp
                    image: jenkins/inbound-agent:jdk21
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "256Mi"
                      limits:
                        cpu: "500m"
                        memory: "1Gi"
                  - name: builder
                    image: netci/ci-toolbox:local
                    command: ["sleep"]
                    args: ["99d"]
                    tty: true
                    resources:
                      requests:
                        cpu: "500m"
                        memory: "1Gi"
                      limits:
                        cpu: "2"
                        memory: "4Gi"
                volumes:
                  - name: workspace
                    emptyDir: {}
