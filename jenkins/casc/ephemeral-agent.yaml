jenkins:
  clouds:
    - kubernetes:
        name: netci-kind
        serverUrl: ${KUBERNETES_API_URL:-https://netci-local-control-plane:6443}
        serverCertificate: ${KUBERNETES_SERVER_CA:-}
        namespace: ${JENKINS_AGENT_NAMESPACE:-netci-build}
        skipTlsVerify: false
        credentialsId: ${KUBERNETES_CREDENTIALS_ID:-netci-kind-token}
        # The address agent pods dial back on. It is not derivable from the
        # controller id: the reachable route depends on how the controller is
        # attached to the cluster network, so it is supplied explicitly.
        jenkinsUrl: ${JENKINS_AGENT_URL:-http://jenkins-a:8080}
        webSocket: true
        containerCapStr: "10"
        maxRequestsPerHostStr: "32"
        podRetention: never
        templates:
          - name: netci-ephemeral
            label: netci-ephemeral
            namespace: ${JENKINS_AGENT_NAMESPACE:-netci-build}
            serviceAccount: ${JENKINS_AGENT_SERVICE_ACCOUNT:-jenkins-agent}
            nodeUsageMode: EXCLUSIVE
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            podRetention: never
            idleMinutes: 0
            yaml: &netciBuildPod |
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  netci.io/agent: ephemeral
              spec:
                automountServiceAccountToken: false
                serviceAccountName: ${JENKINS_AGENT_SERVICE_ACCOUNT:-jenkins-agent}
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                containers:
                  - name: jnlp
                    image: ${JENKINS_INBOUND_AGENT_IMAGE:-jenkins/inbound-agent:3386.v353e57a_1b_ea_0-1-jdk21}
                    env:
                      # The pipeline runs on this container and switches into the one named
                      # here for the actual work. Naming it in the pod template rather than
                      # in the shared library is what lets the same pipeline also run on an
                      # agent that has no containers at all -- the benchmark baseline.
                      - name: NETCI_BUILD_CONTAINER
                        value: builder
                      # podRetention: never + idleMinutes: 0 + an emptyDir workspace mean
                      # this pod and everything in it are deleted after one build. The
                      # pipeline reads this to skip wiping a workspace that is already
                      # going away: the deletion provides the isolation the wipe would.
                      - name: NETCI_AGENT_DISPOSABLE
                        value: "true"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "256Mi"
                      limits:
                        cpu: "500m"
                        memory: "1Gi"
                  - name: builder
                    image: ${JENKINS_TOOLBOX_IMAGE:-netci/ci-toolbox:0.4.0}
                    command: ["sleep"]
                    args: ["99d"]
                    tty: true
                    env:
                      - name: BUILDAH_ISOLATION
                        value: chroot
                      - name: STORAGE_DRIVER
                        value: vfs
                    # Rootless Buildah invokes its setuid uidmap helpers. The
                    # pod still runs as uid 1000 and has no hostPath/socket.
                    securityContext:
                      allowPrivilegeEscalation: true
                    resources:
                      requests:
                        cpu: "500m"
                        memory: "1Gi"
                      limits:
                        cpu: "2"
                        memory: "4Gi"
          # The benchmark's baseline (scripts/gate_benchmark.py): the same pod, kept
          # alive and reused by consecutive builds, so its workspace and caches carry
          # over exactly the way a long-lived agent's do. Nothing netCI dispatches
          # selects it -- a build that can read the previous build's workspace is
          # what the ephemeral design exists to prevent (ADR-007) -- but a delta needs
          # something on the other side of it.
          - name: netci-shared
            label: netci-shared
            namespace: ${JENKINS_AGENT_NAMESPACE:-netci-build}
            serviceAccount: ${JENKINS_AGENT_SERVICE_ACCOUNT:-jenkins-agent}
            nodeUsageMode: EXCLUSIVE
            idleMinutes: 120
            podRetention: always
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            # The same pod spec as the ephemeral template (a YAML anchor, not
            # inheritance: nested `inheritFrom` does not carry the pod YAML through).
            yaml: *netciBuildPod
