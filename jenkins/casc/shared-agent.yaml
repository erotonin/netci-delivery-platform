# The baseline the ephemeral agent is measured against.
#
# A long-lived agent keeps its workspace and caches between builds, so it starts fast
# and reuses work. That is exactly the trade-off ADR-007 gives up on purpose, and the
# benchmark cannot report a delta without something on the other side of it.
#
# This file is loaded only when a benchmark run needs it; the acceptance topology does
# not include a shared agent, because a build that can see a previous build's workspace
# is what the ephemeral design exists to prevent.
jenkins:
  nodes:
    - permanent:
        name: ${JENKINS_SHARED_AGENT_NAME:-netci-shared}
        labelString: "netci-shared"
        remoteFS: ${JENKINS_SHARED_AGENT_ROOT:-/home/jenkins/agent}
        numExecutors: 1
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          jnlp:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"
