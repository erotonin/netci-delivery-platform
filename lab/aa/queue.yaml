# netci-queue in front of the active-active replicas (ADR-081): the IDP's builds are accepted here,
# durably, and dispatched once. Applied by lab/aa/queue.sh; NETCI_IMAGE is replaced by a digest.
#
# Its database is netci_queue on the HA store (store.yaml). It reaches Jenkins through the balancer
# on its own machine (Service haproxy-local): it is a pod, and through the VIP kube-proxy may send
# it to the balancer of a machine that just lost power -- the black hole the agents met (ADR-080).
apiVersion: apps/v1
kind: Deployment
metadata: {name: queue, namespace: aa-p2}
spec:
  replicas: 2   # both dispatch: claims skip each other, dispatch is idempotent
  selector: {matchLabels: {app: queue}}
  template:
    metadata: {labels: {app: queue}}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: queue}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: queue
          image: NETCI_IMAGE
          command: [/netci-queue]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: queue-db, key: url}}
            - {name: NETCI_QUEUE_CONFIG, value: /etc/netci/queue/config.json}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/netci/queue, readOnly: true}
            - {name: cells, mountPath: /etc/netci/cells, readOnly: true}
      volumes:
        - {name: config, configMap: {name: queue}}
        - name: cells
          secret:
            secretName: queue-jenkins
            defaultMode: 0440
            items:
              - {key: user, path: aa/user}
              - {key: token, path: aa/token}
---
# Reachable from the host on every node: the IDP (outside the cluster in the lab) and the probes.
apiVersion: v1
kind: Service
metadata: {name: queue, namespace: aa-p2}
spec:
  type: NodePort
  selector: {app: queue}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30091}]
