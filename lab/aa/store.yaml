# Active-active, the store made HA (ADR-080): netci-homesync's PostgreSQL as three CloudNativePG
# instances, one per machine, each on its own machine's disk (local-path), as the homes are.
# Applied by lab/aa/store.sh, which installs the operator first and moves the data over.
#
# Synchronous to ANY 1 of the two standbys, durability required: a write is acknowledged only once
# a standby has it, so the standby promoted after the primary's machine dies has every acknowledged
# write -- a build number reserved, a version compared-and-set -- and the store does not answer
# "done" for something a failover would forget. With one machine down one standby remains and
# writes go on; with two down writes stop, which is the store refusing rather than forgetting.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: store, namespace: aa-p2}
spec:
  instances: 3
  # CloudNativePG's PostgreSQL 16.15 (ghcr.io/cloudnative-pg/postgresql:16.15-system-trixie,
  # sha256:9314ca1c...), copied into Harbor: the lab's nodes could not finish pulling it from
  # ghcr.io's CDN (connections reset), and every other lab image comes from Harbor too.
  imageName: 172.17.0.1:8930/netci/cnpg-postgresql:16.15-system-trixie@sha256:236091e55fda2ba92dbb60c020a5c63e788303c4faf816d2950ae6d3ef345b13
  imagePullSecrets: [{name: harbor-pull}]
  primaryUpdateStrategy: unsupervised
  failoverDelay: 0
  postgresql:
    synchronous: {method: any, number: 1, dataDurability: required}
    parameters: {max_connections: "100", shared_buffers: "64MB"}
  bootstrap:
    initdb: {database: netci_homesync, owner: homesync}
  # netci-queue's database lives on the same HA store (lab/aa/queue.sh): the role is declared here,
  # its password in the Secret queue-db-role (basic-auth), the database below.
  managed:
    roles:
      - {name: queue, login: true, ensure: present, passwordSecret: {name: queue-db-role}}
  storage: {storageClass: local-path, size: 2Gi}
  # Backups (ADR-083): WAL archived continuously and a base backup daily (ScheduledBackup below) to
  # S3-compatible storage -- the lab's SeaweedFS behind the lab CA; Ceph RGW or MinIO at the site.
  # Replication is not a backup: a job deleted by mistake is deleted on every instance at once.
  # In-tree barman-cloud, deprecated in CloudNativePG in favour of its Barman Cloud plugin (which
  # needs cert-manager); the settings carry over.
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://netci-jenkins-backups/netci-store/aa-p2
      endpointURL: https://172.17.0.1:8333
      endpointCA: {name: store-s3, key: ca.crt}
      s3Credentials:
        accessKeyId: {name: store-s3, key: ACCESS_KEY_ID}
        secretAccessKey: {name: store-s3, key: ACCESS_SECRET_KEY}
      wal: {compression: gzip, maxParallel: 2}
      data: {compression: gzip}
  # One instance per machine, never two: two on one machine is one machine's death taking the
  # primary and the only synchronous standby together.
  affinity: {enablePodAntiAffinity: true, podAntiAffinityType: required, topologyKey: kubernetes.io/hostname}
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 384Mi}}
  # Each instance's manager talks to its own machine's API server, not the Service in front of all
  # three. Through the Service, the soak's power-off of a standby's machine left the primary's pooled
  # connection on that machine's dead API server for ~40 s; CloudNativePG's isolation check then saw
  # neither the API server nor that standby, failed the primary's liveness, and the kubelet
  # restarted a healthy primary (an outage of edits that losing a standby should never cause).
  # Its own machine's API server lives and dies with it.
  env:
    - {name: KUBERNETES_SERVICE_HOST, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
    - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata: {name: netci-queue, namespace: aa-p2}
spec: {name: netci_queue, owner: queue, cluster: {name: store}}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: store-daily, namespace: aa-p2}
spec:
  schedule: "0 0 2 * * *"   # seconds first: 02:00 every day
  backupOwnerReference: self
  cluster: {name: store}
