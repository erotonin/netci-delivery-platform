# Spike cell (ADR-060): one Jenkins controller whose JENKINS_HOME is a Longhorn volume
# replicated to all three nodes. Used to measure what the design assumes -- Pipeline resume,
# agent reconnection, queue loss on a crash, start time -- before anything is built on it.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-a
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: jenkins, namespace: cell-a}
---
# The Kubernetes plugin creates agent pods in this namespace and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: jenkins-agents, namespace: cell-a}
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, events, secrets]
    verbs: [get, list, watch, create, delete, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: jenkins-agents, namespace: cell-a}
subjects: [{kind: ServiceAccount, name: jenkins, namespace: cell-a}]
roleRef: {kind: Role, name: jenkins-agents, apiGroup: rbac.authorization.k8s.io}
---
# The cell agent's Lease, and only it (create cannot be limited by name in RBAC).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cell-lease, namespace: cell-a}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [jenkins]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cell-lease, namespace: cell-a}
subjects: [{kind: ServiceAccount, name: jenkins, namespace: cell-a}]
roleRef: {kind: Role, name: cell-lease, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: jenkins-casc, namespace: cell-a}
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: "netCI spike cell-a"
      numExecutors: 0
      mode: EXCLUSIVE
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: admin
              password: "${readFile:/run/secrets/cell/admin-password}"
            # netCI's dispatcher (ADR-063); it uses an API token generated with this password.
            - id: netci
              password: "${readFile:/run/secrets/cell/netci-password}"
      authorizationStrategy: loggedInUsersCanDoAnything
      clouds:
        - kubernetes:
            name: k8s
            namespace: cell-a
            jenkinsUrl: "http://jenkins.cell-a.svc.cluster.local:8080"
            webSocket: true
            containerCapStr: "10"
            templates:
              - name: spike-ws
                label: spike-ws
                namespace: cell-a
                idleMinutes: 0
                containers:
                  - name: jnlp
                    image: "172.17.0.1:8930/mirror/jenkins/inbound-agent:3386.v353e57a_1b_ea_0-1-jdk21"
                    # The agent reconnects when its controller is replaced (agent-supervisor.sh).
                    command: "/bin/bash"
                    args: "/netci/agent-supervisor.sh"
                    resourceRequestCpu: 100m
                    resourceRequestMemory: 256Mi
                volumes:
                  - configMapVolume:
                      configMapName: agent-supervisor
                      mountPath: /netci
                imagePullSecrets:
                  - name: harbor-pull
                # Never on the controller's node: an agent that dies with its controller takes
                # the build's process with it, and nothing can resume that (ADR-061: agents run
                # on their own pool).
                yaml: |
                  spec:
                    affinity:
                      podAntiAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector: {matchLabels: {app: jenkins}}
                            topologyKey: kubernetes.io/hostname
    unclassified:
      location:
        url: "http://jenkins.cell-a.svc.cluster.local:8080/"
    jobs:
      - script: |
          pipelineJob('resume-probe') {
            parameters { stringParam('DURATION', '240', 'how long the sh step runs, in seconds') }
            definition {
              cps {
                sandbox(true)
                script('''
                  pipeline {
                    agent { label 'spike-ws' }
                    options { durabilityHint('MAX_SURVIVABILITY') }
                    stages {
                      stage('long sh') {
                        steps { sh 'for i in $(seq 1 ^${DURATION}); do echo "tick $i $(date +%T)"; sleep 1; done' }
                      }
                      stage('after') { steps { echo 'reached the stage after the long step' } }
                    }
                  }
                ''')
              }
            }
          }
          pipelineJob('io-probe') {
            definition {
              cps {
                sandbox(true)
                script('''
                  pipeline {
                    agent { label 'spike-ws' }
                    options { durabilityHint('MAX_SURVIVABILITY') }
                    stages {
                      stage('steps') { steps { script { for (int i = 0; i < 200; i++) { echo "step ^${i}" } } } }
                      stage('log') { steps { sh 'seq 1 20000 | sed "s/^/line /"' } }
                    }
                  }
                ''')
              }
            }
          }
          // The same, queued for 20 s: long enough to crash the controller under it, short
          // enough for a probe to wait for the builds afterwards.
          pipelineJob('queue-probe-short') {
            quietPeriod(20)
            definition {
              cps {
                sandbox(true)
                script("echo 'left the queue'")
              }
            }
          }
          // A true queue item: the quiet period keeps it queued, not started, for 5 minutes
          // -- what JENKINS-30909 says a crash loses.
          pipelineJob('queue-probe') {
            quietPeriod(300)
            definition {
              cps {
                sandbox(true)
                script("echo 'left the queue'")
              }
            }
          }
---
apiVersion: v1
kind: Service
metadata: {name: jenkins, namespace: cell-a}
spec:
  selector: {app: jenkins}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: agent, port: 50000, targetPort: 50000}
---
apiVersion: apps/v1
kind: StatefulSet
# netci.io/cell: the supervisor watches this cell's Lease (named after the StatefulSet) and
# fences the machine of a controller that stops renewing it.
metadata: {name: jenkins, namespace: cell-a, labels: {netci.io/cell: "true"}}
spec:
  serviceName: jenkins
  replicas: 1
  selector: {matchLabels: {app: jenkins}}
  template:
    metadata: {labels: {app: jenkins, netci.io/cell: "true"}}
    spec:
      serviceAccountName: jenkins
      imagePullSecrets: [{name: harbor-pull}]
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      # The cell agent kills the controller's JVM the moment the Lease is lost; it can only
      # see and signal it in a shared process namespace (same uid, no capability needed).
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      initContainers:
        # Hands the guard to the controller container, whose image has no copy of it.
        - name: install-guard
          image: NETCI_IMAGE
          command: [/cell-agent, install, /netci-bin]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: netci-bin, mountPath: /netci-bin}]
        # A native sidecar (restartPolicy: Always): started before the controller, and stopped
        # only after the controller has exited -- so the Lease outlives the JVM on a graceful
        # stop and the replacement does not have to wait it out.
        - name: cell-agent
          image: NETCI_IMAGE
          command: [/cell-agent]
          restartPolicy: Always
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NETCI_LEASE_NAME, value: jenkins}
            - {name: NETCI_TERMINATION_GRACE, value: 25s}
          ports: [{name: agent-metrics, containerPort: 9090}]
          startupProbe:
            httpGet: {path: /healthz, port: 9090}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 9090}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext: *restricted
          volumeMounts: [{name: gate, mountPath: /run/netci}]
      containers:
        - name: jenkins
          image: 172.17.0.1:8930/netci/jenkins-controller:2.555.3-netci2
          # Jenkins starts only once the gate is open and is killed when it closes or goes
          # stale (internal/cellagent). jenkins.sh is the image's own start script; tini is left
          # out because the pod's pause container already reaps orphans in a shared namespace.
          command: [/netci-bin/cell-agent, guard, --, /usr/local/bin/jenkins.sh]
          env:
            - {name: NETCI_GATE_FILE, value: /run/netci/gate}
            - {name: NETCI_RENEW_DEADLINE, value: 4s}
            - {name: CASC_JENKINS_CONFIG, value: /var/jenkins_config/jenkins.yaml}
            - {name: JAVA_OPTS, value: "-Xms1g -Xmx1536m -Djenkins.install.runSetupWizard=false"}
            # The WAR and the exploded plugins come from the image; they are not state. On the
            # pod's local disk they cost nothing on the replicated, synchronously written
            # JENKINS_HOME (the first start with them there took ~12 min).
            - {name: JENKINS_OPTS, value: "--webroot=/var/cache/jenkins/war --pluginroot=/var/cache/jenkins/plugins"}
          ports: [{containerPort: 8080}, {containerPort: 50000}]
          readinessProbe:
            httpGet: {path: /login, port: 8080}
            periodSeconds: 2
            failureThreshold: 3
          # A JVM that hangs while the agent keeps renewing would hold the cell and serve
          # nothing; liveness restarts the container (and the guard waits for the gate again).
          startupProbe:
            httpGet: {path: /login, port: 8080}
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: {path: /login, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 2560Mi}
          volumeMounts:
            - {name: home, mountPath: /var/jenkins_home}
            - {name: casc, mountPath: /var/jenkins_config}
            - {name: cache, mountPath: /var/cache/jenkins}
            - {name: secrets, mountPath: /run/secrets/cell, readOnly: true}
            - {name: gate, mountPath: /run/netci, readOnly: true}
            - {name: netci-bin, mountPath: /netci-bin, readOnly: true}
      volumes:
        - {name: gate, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: netci-bin, emptyDir: {sizeLimit: 128Mi}}
        - {name: casc, configMap: {name: jenkins-casc}}
        - {name: cache, emptyDir: {}}
        - {name: secrets, secret: {secretName: jenkins-cell}}
  volumeClaimTemplates:
    - metadata: {name: home}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-commit1
        resources: {requests: {storage: 10Gi}}
---
# Reachable from the host on every node, whichever node the controller runs on: the probes
# keep measuring across a takeover instead of losing a port-forward with the old pod.
apiVersion: v1
kind: Service
metadata: {name: jenkins-np, namespace: cell-a}
spec:
  type: NodePort
  selector: {app: jenkins}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30080}]
