release: netci-local-rc1
checks:
  - id: doctor-windows
    profiles: [windows]
    state: ready
    command: [python, scripts/doctor.py, --profile, windows]
  - id: doctor-ubuntu
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/doctor.py, --profile, ubuntu]
  - id: source-structure
    profiles: [windows, ubuntu]
    state: ready
    command: [python, scripts/validate_windows.py]
  - id: release-manifest
    profiles: [windows, ubuntu]
    state: ready
    command: [python, scripts/validate_release.py]
  - id: catalog
    profiles: [windows, ubuntu]
    state: ready
    command: [python, scripts/validate_catalog.py]
  - id: platform-static
    profiles: [windows, ubuntu]
    state: ready
    command: [python, scripts/validate_platform.py]
  - id: backend-and-contract-tests
    profiles: [windows, ubuntu]
    state: ready
    command: [python, -m, pytest, backend/tests, tests/contract, -q]
  - id: frontend-build
    profiles: [windows, ubuntu]
    state: ready
    command: [npm, --prefix, frontend, run, build]
  - id: compose-config
    profiles: [ubuntu]
    state: ready
    command: [docker, compose, config]
  - id: helm-lint
    profiles: [ubuntu]
    state: ready
    command: [helm, lint, deploy/helm/sample-kubernetes-app]
  - id: kind-cluster
    profiles: [ubuntu]
    state: blocked
    reason: Cluster bootstrap and namespace evidence must be implemented and verified on Ubuntu 24.04.
    command: [make, kind-up]
  - id: jenkins-rebuild
    profiles: [ubuntu]
    state: blocked
    reason: A destructive JCasC rebuild rehearsal with retained evidence has not run on Ubuntu.
    command: [make, jenkins-rebuild]
  - id: e2e-container
    profiles: [ubuntu]
    state: blocked
    reason: No executable container E2E runner and evidence assertion exists yet.
    command: [make, e2e-container]
  - id: e2e-kubernetes
    profiles: [ubuntu]
    state: blocked
    reason: No executable Kubernetes E2E runner and evidence assertion exists yet.
    command: [make, e2e-kubernetes]
  - id: e2e-systemd
    profiles: [ubuntu]
    state: blocked
    reason: No executable Systemd E2E runner and evidence assertion exists yet.
    command: [make, e2e-systemd]
  - id: security-gate
    profiles: [ubuntu]
    state: blocked
    reason: The deny test does not yet verify real SBOM, scan and signature evidence.
    command: [make, security-test]
  - id: benchmark
    profiles: [ubuntu]
    state: blocked
    reason: Shared and ephemeral benchmark commands and measured phase timings are not implemented.
    command: [make, benchmark]
  - id: failure-drill
    profiles: [ubuntu]
    state: blocked
    reason: The current harness does not stop, detect, reroute and rejoin real controllers.
    command: [make, failure-drill]
  - id: dora-dashboard
    profiles: [ubuntu]
    state: blocked
    reason: Dashboard runtime and source-event verification are not implemented.
    command: [make, dora-dashboard]
  - id: backstage-integration
    profiles: [ubuntu]
    state: blocked
    reason: The Software Template needs a real Backstage instance and proxy integration test.
    command: [make, backstage-test]
