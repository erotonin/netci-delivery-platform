# Release gates for netCI.
#
# `state: ready` means the command runs real work and asserts on the result. Gates that
# write an evidence file under evidence/ record every command, timing, output and
# assertion, so a green result can be re-read rather than trusted.
#
# `state: blocked` means no runner exists yet, or the infrastructure it needs is not
# available. A blocked gate is deliberate: `validate_release.py --execute` refuses to
# pass the profile while one remains, which is what stops a demo from looking finished
# before it is. Never flip a gate to ready without a command and an assertion behind it.
#
# No gate is blocked today. Every one of them runs, and the last five need the Jenkins and
# Backstage labs up first -- see the comment above them. Keeping the `blocked` mechanism
# documented matters more than the fact that nothing currently uses it: the next gate to
# be added starts there.
release: netci-local-rc1
checks:
  - id: doctor-windows
    profiles: [windows]
    state: ready
    command: [python, scripts/doctor.py, --profile, windows]
  - id: doctor-ubuntu
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/doctor.py, --profile, ubuntu]
  - id: source-structure
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [python, scripts/validate_windows.py]
  - id: open-source-readiness
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [node, scripts/validate_oss_readiness.mjs]
  - id: release-manifest
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [python, scripts/validate_release.py]
  - id: catalog
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [python, scripts/validate_catalog.py]
  - id: platform-static
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [python, scripts/validate_platform.py]
  - id: schema-migrations
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [python, scripts/migrate.py, --check-schema]
  - id: backend-and-contract-tests
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [python, -m, pytest, backend/tests, tests/contract, -q]
  - id: frontend-build
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [npm, --prefix, frontend, run, build]
  - id: frontend-tests
    profiles: [portable, windows, ubuntu]
    state: ready
    command: [npm, --prefix, frontend, test]
  - id: compose-config
    profiles: [ubuntu]
    state: ready
    command: [docker, compose, config]
  - id: helm-lint
    profiles: [ubuntu]
    state: ready
    command: [helm, lint, deploy/helm/sample-kubernetes-app]

  # ------------------------------------------------------------ executable gates
  # Each runs real infrastructure and writes evidence/<gate>.json.
  - id: kind-cluster
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_kind.py]
  - id: security-gate
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_security.py]
  - id: e2e-container
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_e2e_container.py]
  - id: e2e-kubernetes
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_e2e_kubernetes.py]
  - id: e2e-systemd
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_e2e_systemd.py]
  - id: dora-dashboard
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_dora.py]
  # The Portal in a real browser against the running API, plus an axe accessibility scan.
  # Not in the portable profile: it needs a live netCI, and a browser suite pointed at
  # nothing would pass by testing nothing.
  - id: portal-browser
    profiles: [ubuntu]
    state: ready
    command: [npm, --prefix, frontend, run, test:e2e]

  # ------------------------------------------------- gates that need the Jenkins lab
  # Same contract as the gates above -- real work, real assertions, evidence written --
  # but they drive two live Jenkins controllers, so `bash scripts/jenkins_lab.sh up` (and
  # `bash scripts/backstage_lab.sh up` for the last one) has to come first. Source
  # .netci-gate/jenkins/lab.env to hand them the URLs and credentials.
  - id: jenkins-ci-loop
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_jenkins_ci.py]
  - id: jenkins-rebuild
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_jenkins_rebuild.py]
  - id: failure-drill
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_failure_drill.py]
  - id: benchmark
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_benchmark.py]
  - id: backstage-integration
    profiles: [ubuntu]
    state: ready
    command: [python3, scripts/gate_backstage.py]
