templates:
  - id: container-ci-cd-v1
    name: Container CI/CD v1
    runtime: docker
    artifactKind: container-image
    stages: [checkout, unit-test, build, sbom, vulnerability-scan, sign, publish, deploy, health-check]
    deployAdapter: docker
    environments: [dev, staging, prod]
  - id: kubernetes-ci-cd-v1
    name: Kubernetes CI/CD v1
    runtime: kubernetes
    artifactKind: container-image
    stages: [checkout, unit-test, build, sbom, vulnerability-scan, sign, publish, deploy, health-check]
    deployAdapter: kubernetes
    environments: [dev, staging, prod]
  - id: systemd-ansible-ci-cd-v1
    name: Systemd Ansible CI/CD v1
    runtime: systemd
    artifactKind: linux-binary
    stages: [checkout, unit-test, build, publish, deploy, health-check]
    deployAdapter: systemd
    environments: [dev, staging, prod]
