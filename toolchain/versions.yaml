jenkins:
  # The controller netCI builds and rolls out (ADR-059). The base is pinned by digest; the
  # tag is what infra/corp/jenkins/values.yaml runs, and a new plugin set is a new tag
  # (Harbor tags are immutable).
  controller:
    base: "jenkins/jenkins:2.555.3-lts-jdk21@sha256:e82bbdcffb6361c081ac66bbdcd5802a299b3631c78c3be04a0a91c7f952fff3"
    image: "netci/jenkins-controller"
    tag: "2.555.3-netci8"
  # What netCI's pipelines use directly. The rest of `plugins` is what these need.
  requires: [configuration-as-code, kubernetes, workflow-aggregator, git, ws-cleanup, job-dsl, git-client, plain-credentials, credentials-binding, pipeline-stage-view, pipeline-utility-steps, timestamper, matrix-auth, opentelemetry]
